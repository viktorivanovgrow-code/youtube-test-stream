name: YouTube Stream

on:
  workflow_dispatch:
    inputs:
      handoff_epoch:
        description: "Unix timestamp when this video should start"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # FFMPEG CACHE
      # ---------------------------------------------------------
      - name: Restore FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v2

      # ---------------------------------------------------------
      # INSTALL FFMPEG
      # ---------------------------------------------------------
      - name: Install FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/ffmpeg"

          wget -q \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            -O /tmp/ffmpeg.tar.xz

          tar -xJf /tmp/ffmpeg.tar.xz \
            --strip-components=1 \
            -C "$HOME/ffmpeg"

      # ---------------------------------------------------------
      # VERIFY FFMPEG
      # ---------------------------------------------------------
      - name: Verify FFmpeg
        shell: bash
        run: |
          set -e

          "$HOME/ffmpeg/bin/ffmpeg" -version | head -n 1
          "$HOME/ffmpeg/bin/ffprobe" -version | head -n 1

      # ---------------------------------------------------------
      # RANDOM VIDEO
      # ---------------------------------------------------------
      - name: Select random video
        shell: bash
        run: |
          set -e

          VIDEO_URL=$(python3 - <<'PY'
          import json
          import random

          with open("playlist.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          playlist = data["videos"]

          if not playlist:
              raise RuntimeError("playlist.json: список videos пуст")

          print(random.choice(playlist))
          PY
          )

          echo "Selected video:"
          echo "$VIDEO_URL"

          echo "VIDEO_URL=$VIDEO_URL" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # DOWNLOAD
      # ---------------------------------------------------------
      - name: Download video
        shell: bash
        run: |
          set -e

          echo "Downloading selected video..."

          wget \
            --progress=dot:giga \
            -O stream_video.mp4 \
            "$VIDEO_URL"

          echo "Download completed."

          ls -lh stream_video.mp4

      # ---------------------------------------------------------
      # PROBE DURATION
      # ---------------------------------------------------------
      - name: Probe video
        shell: bash
        run: |
          set -e

          DURATION=$(
            "$HOME/ffmpeg/bin/ffprobe" \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              stream_video.mp4
          )

          echo "Exact duration: $DURATION seconds"

          DURATION_INT=$(python3 - "$DURATION" <<'PY'
          import sys
          import math

          duration = float(sys.argv[1])
          print(math.ceil(duration))
          PY
          )

          echo "Rounded duration: $DURATION_INT seconds"

          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "DURATION_INT=$DURATION_INT" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # CALCULATE TIMING
      # ---------------------------------------------------------
      - name: Calculate timing
        shell: bash
        run: |
          set -e

          PREP_LEAD=180
          OVERLAP=6

          INPUT_HANDOFF="${{ inputs.handoff_epoch }}"

          if [ "$INPUT_HANDOFF" = "0" ]; then
            START_EPOCH=$(date +%s)
            echo "First video."
          else
            START_EPOCH="$INPUT_HANDOFF"
            echo "Scheduled handoff: $START_EPOCH"
          fi

          END_EPOCH=$((START_EPOCH + DURATION_INT))

          NEXT_START_EPOCH=$((END_EPOCH - OVERLAP))

          DISPATCH_EPOCH=$((END_EPOCH - PREP_LEAD))

          NOW=$(date +%s)

          if [ "$DISPATCH_EPOCH" -lt "$NOW" ]; then
            DISPATCH_EPOCH="$NOW"
          fi

          echo "========================================"
          echo "START_EPOCH:      $START_EPOCH"
          echo "END_EPOCH:        $END_EPOCH"
          echo "NEXT_START_EPOCH: $NEXT_START_EPOCH"
          echo "DISPATCH_EPOCH:   $DISPATCH_EPOCH"
          echo "PREP_LEAD:        $PREP_LEAD seconds"
          echo "OVERLAP:          $OVERLAP seconds"
          echo "========================================"

          echo "START_EPOCH=$START_EPOCH" >> "$GITHUB_ENV"
          echo "END_EPOCH=$END_EPOCH" >> "$GITHUB_ENV"
          echo "NEXT_START_EPOCH=$NEXT_START_EPOCH" >> "$GITHUB_ENV"
          echo "DISPATCH_EPOCH=$DISPATCH_EPOCH" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # WAIT FOR START
      # ---------------------------------------------------------
      - name: Wait until start
        shell: bash
        run: |
          set -e

          NOW=$(date +%s)
          WAIT=$((START_EPOCH - NOW))

          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting $WAIT seconds..."
            sleep "$WAIT"
          fi

          echo "Start time reached."

      # ---------------------------------------------------------
      # START FFMPEG
      # ---------------------------------------------------------
      - name: Start FFmpeg
        shell: bash
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          set -e

          echo "Starting FFmpeg..."
          echo "Streaming to YouTube..."

          "$HOME/ffmpeg/bin/ffmpeg" \
            -hide_banner \
            -loglevel info \
            -fflags +genpts \
            -re \
            -i stream_video.mp4 \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            > ffmpeg.log 2>&1 &

          PID=$!

          echo "$PID" > ffmpeg.pid

          echo "FFmpeg PID: $PID"

      # ---------------------------------------------------------
      # WAIT UNTIL NEXT ACTION MUST BE STARTED
      # ---------------------------------------------------------
      - name: Wait until next Action
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          while true; do

            NOW=$(date +%s)
            REMAIN=$((DISPATCH_EPOCH - NOW))

            if [ "$REMAIN" -le 0 ]; then
              break
            fi

            if [ "$REMAIN" -gt 30 ]; then
              sleep 20
            else
              sleep "$REMAIN"
            fi

          done

          echo "========================================"
          echo "Starting next Action"
          echo "Next video start: $NEXT_START_EPOCH"
          echo "========================================"

          curl -sS \
            -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/stream-chain-test.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"handoff_epoch\":\"$NEXT_START_EPOCH\"}}"

          echo
          echo "Next Action dispatched."

      # ---------------------------------------------------------
      # WAIT UNTIL CURRENT VIDEO ENDS
      # ---------------------------------------------------------
      - name: Wait until video end
        shell: bash
        run: |
          set -e

          while true; do

            NOW=$(date +%s)
            REMAIN=$((END_EPOCH - NOW))

            if [ "$REMAIN" -le 0 ]; then
              break
            fi

            if [ "$REMAIN" -gt 30 ]; then
              sleep 20
            else
              sleep "$REMAIN"
            fi

          done

          echo "Current video finished."

      # ---------------------------------------------------------
      # STOP FFMPEG
      # ---------------------------------------------------------
      - name: Stop FFmpeg
        shell: bash
        run: |
          set +e

          if [ -f ffmpeg.pid ]; then

            PID=$(cat ffmpeg.pid)

            echo "Stopping FFmpeg PID $PID..."

            kill "$PID" 2>/dev/null || true

            sleep 2

            if kill -0 "$PID" 2>/dev/null; then
              echo "FFmpeg still running. Killing..."
              kill -9 "$PID" 2>/dev/null || true
            fi

          fi

      # ---------------------------------------------------------
      # LOG
      # ---------------------------------------------------------
      - name: Show FFmpeg log
        if: always()
        shell: bash
        run: |
          echo "========== FFMPEG LOG =========="

          if [ -f ffmpeg.log ]; then
            tail -n 150 ffmpeg.log
          else
            echo "ffmpeg.log not found"
          fi
