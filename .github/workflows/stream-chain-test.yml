name: Stream Chain A-B Test

on:
  workflow_dispatch:
    inputs:
      handoff_epoch:
        description: "Unix timestamp when B must start"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. INSTALL FFMPEG
      # ============================================================

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ============================================================
      # 3. SELECT RANDOM VIDEO
      # ============================================================

      - name: Select random video
        id: select
        shell: bash
        run: |
          set -e

          VIDEO_URL=$(python3 -c '
          import json
          import random

          with open("playlist.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          videos = data["videos"]

          if not videos:
              raise SystemExit("ERROR: playlist is empty")

          print(random.choice(videos))
          ')

          echo "========================================"
          echo "SELECTED VIDEO"
          echo "========================================"
          echo "$VIDEO_URL"
          echo "========================================"

          {
            echo "video_url<<EOF"
            echo "$VIDEO_URL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. DOWNLOAD VIDEO
      # ============================================================

      - name: Download video
        shell: bash
        run: |
          set -e

          URL="${{ steps.select.outputs.video_url }}"

          echo "========================================"
          echo "DOWNLOADING VIDEO"
          echo "========================================"
          echo "$URL"
          echo

          START=$(date +%s)

          wget \
            --tries=3 \
            --timeout=30 \
            --progress=bar:force:noscroll \
            -O stream_video.mp4 \
            "$URL"

          END=$(date +%s)
          ELAPSED=$((END - START))

          BYTES=$(stat -c%s stream_video.mp4)
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES / 1000000}")

          if [ "$ELAPSED" -lt 1 ]; then
            ELAPSED=1
          fi

          SPEED=$(awk "BEGIN {printf \"%.2f\", $BYTES / $ELAPSED / 1000000}")

          echo
          echo "========================================"
          echo "DOWNLOAD COMPLETE"
          echo "========================================"
          echo "Size:  ${MB} MB"
          echo "Time:  ${ELAPSED} sec"
          echo "Speed: ${SPEED} MB/s"
          echo "========================================"


      # ============================================================
      # 5. ANALYZE VIDEO
      # ============================================================

      - name: Analyze video
        id: video
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VIDEO INFORMATION"
          echo "========================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,bit_rate,pix_fmt,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            stream_video.mp4

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            stream_video.mp4)

          DURATION_INT=$(python3 -c "
          import math
          print(math.ceil(float('$DURATION')))
          ")

          echo
          echo "Duration:     $DURATION sec"
          echo "Duration int: $DURATION_INT sec"

          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "duration_int=$DURATION_INT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 6. ACTION A
      #
      # A starts YouTube immediately.
      # Then calculates handoff:
      #
      # A_START + VIDEO_DURATION - 30 sec
      #
      # Then immediately dispatches B.
      # ============================================================

      - name: Start Action A and dispatch B
        if: |
          github.event.inputs.handoff_epoch == '0' ||
          github.event.inputs.handoff_epoch == ''

        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          GH_TOKEN: ${{ github.token }}

        shell: bash
        run: |
          set -e

          DURATION="${{ steps.video.outputs.duration }}"
          DURATION_INT="${{ steps.video.outputs.duration_int }}"

          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "ERROR: YOUTUBE_STREAM_KEY secret is empty"
            exit 1
          fi

          # --------------------------------------------------------
          # Record the moment when A is launched.
          # --------------------------------------------------------

          START_EPOCH=$(date +%s)

          # --------------------------------------------------------
          # B must start 30 seconds before A ends.
          # --------------------------------------------------------

          HANDOFF_EPOCH=$((START_EPOCH + DURATION_INT - 30))

          END_EPOCH=$((START_EPOCH + DURATION_INT))

          echo
          echo "========================================"
          echo "ACTION A"
          echo "========================================"
          echo "A start epoch:       $START_EPOCH"
          echo "Video duration:      $DURATION sec"
          echo "Expected A end:      $END_EPOCH"
          echo "B handoff:           $HANDOFF_EPOCH"
          echo "Overlap:             30 sec"
          echo "========================================"
          echo

          # --------------------------------------------------------
          # Start A immediately.
          #
          # FFmpeg runs in background so this Action can dispatch B.
          # --------------------------------------------------------

          echo "STARTING ACTION A YOUTUBE STREAM..."

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -re \
            -i stream_video.mp4 \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            > ffmpeg_A.log 2>&1 &

          FF_PID=$!

          echo "========================================"
          echo "ACTION A FFMPEG STARTED"
          echo "PID: $FF_PID"
          echo "========================================"

          # --------------------------------------------------------
          # Give FFmpeg a moment to establish the RTMP connection.
          # This is NOT a handoff delay.
          # B will still start 30 sec before A ends.
          # --------------------------------------------------------

          sleep 2

          # --------------------------------------------------------
          # Dispatch B immediately.
          # B receives the exact future timestamp when it must start.
          # --------------------------------------------------------

          echo
          echo "DISPATCHING ACTION B..."
          echo "B will start at epoch: $HANDOFF_EPOCH"

          gh workflow run stream-chain-test.yml \
            --repo "${GITHUB_REPOSITORY}" \
            -f handoff_epoch="$HANDOFF_EPOCH"

          echo
          echo "========================================"
          echo "ACTION B DISPATCHED"
          echo "========================================"
          echo "B target start: $HANDOFF_EPOCH"
          echo

          # --------------------------------------------------------
          # A continues streaming until its video ends.
          # --------------------------------------------------------

          wait "$FF_PID"

          EXIT_CODE=$?

          echo
          echo "========================================"
          echo "ACTION A FINISHED"
          echo "FFmpeg exit code: $EXIT_CODE"
          echo "========================================"

          exit "$EXIT_CODE"


      # ============================================================
      # 7. ACTION B
      #
      # B has already downloaded and prepared its video.
      #
      # It MUST wait until:
      #
      # HANDOFF_EPOCH
      #
      # Then starts YouTube.
      # ============================================================

      - name: Wait for B handoff
        if: |
          github.event.inputs.handoff_epoch != '0' &&
          github.event.inputs.handoff_epoch != ''

        shell: bash
        run: |
          set -e

          HANDOFF_EPOCH="${{ github.event.inputs.handoff_epoch }}"

          NOW=$(date +%s)

          echo
          echo "========================================"
          echo "ACTION B"
          echo "========================================"
          echo "B handoff epoch: $HANDOFF_EPOCH"
          echo "Current epoch:   $NOW"
          echo "========================================"

          if [ "$NOW" -ge "$HANDOFF_EPOCH" ]; then

            LATE=$((NOW - HANDOFF_EPOCH))

            echo
            echo "WARNING:"
            echo "B runner is already late by ${LATE} seconds."
            echo "B will start immediately."
            echo

          else

            WAIT_TIME=$((HANDOFF_EPOCH - NOW))

            echo
            echo "B video is ready."
            echo "Waiting ${WAIT_TIME} seconds."
            echo "========================================"

            while true; do

              NOW=$(date +%s)
              REMAINING=$((HANDOFF_EPOCH - NOW))

              if [ "$REMAINING" -le 0 ]; then
                break
              fi

              echo "B waiting... ${REMAINING} sec remaining"

              if [ "$REMAINING" -gt 10 ]; then
                sleep 5
              else
                sleep 1
              fi

            done

          fi

          echo
          echo "========================================"
          echo "B HANDOFF TIME REACHED"
          echo "STARTING B NOW"
          echo "========================================"


      # ============================================================
      # 8. START YOUTUBE — ACTION B
      # ============================================================

      - name: Start YouTube stream B
        if: |
          github.event.inputs.handoff_epoch != '0' &&
          github.event.inputs.handoff_epoch != ''

        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        shell: bash
        run: |
          set -e

          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "ERROR: YOUTUBE_STREAM_KEY secret is empty"
            exit 1
          fi

          ACTUAL_B_START=$(date +%s)

          HANDOFF_EPOCH="${{ github.event.inputs.handoff_epoch }}"

          DELTA=$((ACTUAL_B_START - HANDOFF_EPOCH))

          echo
          echo "========================================"
          echo "STARTING ACTION B"
          echo "========================================"
          echo "Target B start:  $HANDOFF_EPOCH"
          echo "Actual B start:  $ACTUAL_B_START"
          echo "Timing delta:    ${DELTA} sec"
          echo "Duration:        ${{ steps.video.outputs.duration }} sec"
          echo "Video:           copy"
          echo "Audio:           copy"
          echo "========================================"
          echo

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -re \
            -i stream_video.mp4 \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"


      # ============================================================
      # 9. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        run: |
          rm -f stream_video.mp4
          rm -f ffmpeg_A.log
          echo "Downloaded video removed."
