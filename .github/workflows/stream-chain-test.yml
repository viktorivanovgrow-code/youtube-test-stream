name: YouTube Stream Chain

on:
  workflow_dispatch:
    inputs:
      handoff_epoch:
        description: "Unix timestamp when this video should start"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Restore / install FFmpeg
      # ---------------------------------------------------------
      - name: Restore FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v2

      - name: Install FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/ffmpeg"

          wget -q \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            -O /tmp/ffmpeg.tar.xz

          tar -xJf /tmp/ffmpeg.tar.xz \
            --strip-components=1 \
            -C "$HOME/ffmpeg"

      # ---------------------------------------------------------
      # 3. Verify FFmpeg
      # ---------------------------------------------------------
      - name: Verify FFmpeg
        shell: bash
        run: |
          set -e

          "$HOME/ffmpeg/bin/ffmpeg" -version | head -n 1
          "$HOME/ffmpeg/bin/ffprobe" -version | head -n 1

      # ---------------------------------------------------------
      # 4. Select random video
      # ---------------------------------------------------------
      - name: Select random video
        shell: bash
        run: |
          set -e

          VIDEO_URL=$(python3 - <<'PY'
          import json
          import random

          with open("playlist.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          playlist = data["videos"]

          if not playlist:
              raise RuntimeError("playlist.json: список videos пуст")

          print(random.choice(playlist))
          PY
          )

          echo "Selected video:"
          echo "$VIDEO_URL"

          echo "VIDEO_URL=$VIDEO_URL" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 5. Download video completely
      # ---------------------------------------------------------
      - name: Download video
        shell: bash
        run: |
          set -e

          echo "Downloading selected video..."

          wget \
            --progress=dot:giga \
            -O stream_video.mp4 \
            "$VIDEO_URL"

          ls -lh stream_video.mp4

      # ---------------------------------------------------------
      # 6. Probe exact duration
      # ---------------------------------------------------------
      - name: Probe video
        shell: bash
        run: |
          set -e

          DURATION=$(
            "$HOME/ffmpeg/bin/ffprobe" \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              stream_video.mp4
          )

          echo "Exact duration: $DURATION seconds"

          DURATION_INT=$(python3 - "$DURATION" <<'PY'
          import sys
          import math

          duration = float(sys.argv[1])
          print(math.ceil(duration))
          PY
          )

          echo "Duration rounded up: $DURATION_INT seconds"

          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "DURATION_INT=$DURATION_INT" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 7. Calculate timing
      # ---------------------------------------------------------
      - name: Calculate timing
        shell: bash
        run: |
          set -e

          PREP_LEAD=180
          OVERLAP=4

          INPUT_HANDOFF="${{ inputs.handoff_epoch }}"

          if [ "$INPUT_HANDOFF" = "0" ]; then
            START_EPOCH=$(date +%s)
            echo "First session."
          else
            START_EPOCH="$INPUT_HANDOFF"
            echo "Handoff start: $START_EPOCH"
          fi

          END_EPOCH=$((START_EPOCH + DURATION_INT))

          # Next video starts 4 seconds before this video ends
          NEXT_START_EPOCH=$((END_EPOCH - OVERLAP))

          # Next Action is launched 180 seconds before handoff
          DISPATCH_EPOCH=$((END_EPOCH - PREP_LEAD))

          # Safety guard
          if [ "$DISPATCH_EPOCH" -lt "$(date +%s)" ]; then
            DISPATCH_EPOCH="$(date +%s)"
          fi

          echo "----------------------------------------"
          echo "START_EPOCH:       $START_EPOCH"
          echo "END_EPOCH:         $END_EPOCH"
          echo "NEXT_START_EPOCH:  $NEXT_START_EPOCH"
          echo "DISPATCH_EPOCH:    $DISPATCH_EPOCH"
          echo "PREP_LEAD:         $PREP_LEAD sec"
          echo "OVERLAP:            $OVERLAP sec"
          echo "----------------------------------------"

          echo "START_EPOCH=$START_EPOCH" >> "$GITHUB_ENV"
          echo "END_EPOCH=$END_EPOCH" >> "$GITHUB_ENV"
          echo "NEXT_START_EPOCH=$NEXT_START_EPOCH" >> "$GITHUB_ENV"
          echo "DISPATCH_EPOCH=$DISPATCH_EPOCH" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 8. Wait until scheduled start
      # ---------------------------------------------------------
      - name: Wait until start
        shell: bash
        run: |
          set -e

          NOW=$(date +%s)
          WAIT=$((START_EPOCH - NOW))

          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting $WAIT seconds until video start..."
            sleep "$WAIT"
          else
            echo "Start time already reached."
          fi

      # ---------------------------------------------------------
      # 9. Start FFmpeg
      # ---------------------------------------------------------
      - name: Start FFmpeg
        shell: bash
        run: |
          set -e

          echo "Starting FFmpeg..."
          echo "Video will stream until: $END_EPOCH"

          "$HOME/ffmpeg/bin/ffmpeg" \
            -hide_banner \
            -loglevel info \
            -re \
            -i stream_video.mp4 \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            > ffmpeg.log 2>&1 &

          echo $! > ffmpeg.pid

          echo "FFmpeg PID: $(cat ffmpeg.pid)"

      # ---------------------------------------------------------
      # 10. Wait until it is time to launch next Action
      # ---------------------------------------------------------
      - name: Wait until next Action dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          while true; do
            NOW=$(date +%s)
            REMAIN=$((DISPATCH_EPOCH - NOW))

            if [ "$REMAIN" -le 0 ]; then
              break
            fi

            if [ "$REMAIN" -gt 30 ]; then
              echo "Next Action will be dispatched in $REMAIN seconds..."
              sleep 20
            else
              echo "Next Action will be dispatched in $REMAIN seconds..."
              sleep "$REMAIN"
            fi
          done

          echo "Dispatching next Action..."

          RESPONSE=$(curl -sS \
            -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/stream-chain-test.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"handoff_epoch\":\"$NEXT_START_EPOCH\"}}")

          echo "GitHub API response:"
          echo "$RESPONSE"

      # ---------------------------------------------------------
      # 11. Wait until current video end
      # ---------------------------------------------------------
      - name: Wait until video end
        shell: bash
        run: |
          set -e

          while true; do
            NOW=$(date +%s)
            REMAIN=$((END_EPOCH - NOW))

            if [ "$REMAIN" -le 0 ]; then
              break
            fi

            if [ "$REMAIN" -gt 30 ]; then
              sleep 20
            else
              sleep "$REMAIN"
            fi
          done

          echo "Current video end reached."

      # ---------------------------------------------------------
      # 12. Stop current FFmpeg
      # ---------------------------------------------------------
      - name: Stop FFmpeg
        shell: bash
        run: |
          set +e

          if [ -f ffmpeg.pid ]; then
            PID=$(cat ffmpeg.pid)

            echo "Stopping FFmpeg PID $PID..."

            kill "$PID" 2>/dev/null || true

            sleep 2

            if kill -0 "$PID" 2>/dev/null; then
              echo "FFmpeg still running. Sending SIGKILL..."
              kill -9 "$PID" 2>/dev/null || true
            fi
          fi

      # ---------------------------------------------------------
      # 13. Show FFmpeg log
      # ---------------------------------------------------------
      - name: Show FFmpeg log
        if: always()
        shell: bash
        run: |
          echo "========== LAST FFMPEG LOG =========="

          if [ -f ffmpeg.log ]; then
            tail -n 150 ffmpeg.log
          else
            echo "ffmpeg.log not found"
          fi
