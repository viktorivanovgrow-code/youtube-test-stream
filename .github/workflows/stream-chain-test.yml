name: Stream Chain A-B Test

on:
  workflow_dispatch:
    inputs:
      handoff_epoch:
        description: "Unix timestamp when previous stream ends"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. INSTALL FFMPEG
      # ============================================================

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ============================================================
      # 3. SELECT RANDOM VIDEO
      # ============================================================

      - name: Select random video
        id: select
        shell: bash
        run: |
          set -e

          VIDEO_URL=$(python3 -c '
          import json
          import random

          with open("playlist.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          videos = data["videos"]

          if not videos:
              raise SystemExit("ERROR: playlist is empty")

          print(random.choice(videos))
          ')

          echo "========================================"
          echo "SELECTED VIDEO"
          echo "========================================"
          echo "$VIDEO_URL"
          echo "========================================"

          {
            echo "video_url<<EOF"
            echo "$VIDEO_URL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. DOWNLOAD VIDEO
      # ============================================================

      - name: Download video
        shell: bash
        run: |
          set -e

          URL="${{ steps.select.outputs.video_url }}"

          echo "========================================"
          echo "DOWNLOADING VIDEO"
          echo "========================================"
          echo "$URL"
          echo

          START=$(date +%s)

          wget \
            --tries=3 \
            --timeout=30 \
            --progress=bar:force:noscroll \
            -O stream_video.mp4 \
            "$URL"

          END=$(date +%s)
          ELAPSED=$((END - START))

          BYTES=$(stat -c%s stream_video.mp4)
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES / 1000000}")

          if [ "$ELAPSED" -lt 1 ]; then
            ELAPSED=1
          fi

          SPEED=$(awk "BEGIN {printf \"%.2f\", $BYTES / $ELAPSED / 1000000}")

          echo
          echo "========================================"
          echo "DOWNLOAD COMPLETE"
          echo "========================================"
          echo "Size:  ${MB} MB"
          echo "Time:  ${ELAPSED} sec"
          echo "Speed: ${SPEED} MB/s"
          echo "========================================"

      # ============================================================
      # 5. ANALYZE VIDEO
      # ============================================================

      - name: Analyze video
        id: video
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VIDEO INFORMATION"
          echo "========================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,bit_rate,pix_fmt,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            stream_video.mp4

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            stream_video.mp4)

          DURATION_INT=$(python3 -c "
          import math
          print(math.ceil(float('$DURATION')))
          ")

          echo
          echo "Duration:     $DURATION sec"
          echo "Duration int: $DURATION_INT sec"

          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "duration_int=$DURATION_INT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 6. CALCULATE STREAM END TIME
      # ============================================================

      - name: Calculate stream timing
        id: timing
        shell: bash
        run: |
          set -e

          INPUT_HANDOFF="${{ github.event.inputs.handoff_epoch }}"

          if [ "$INPUT_HANDOFF" != "0" ] && [ -n "$INPUT_HANDOFF" ]; then

            # ======================================================
            # THIS IS ACTION B
            # Previous Action A already has a known end time.
            # ======================================================

            STREAM_END="$INPUT_HANDOFF"

            echo "========================================"
            echo "THIS IS ACTION B"
            echo "========================================"
            echo "Previous stream end:"
            echo "$STREAM_END"
            echo "========================================"

            echo "stream_end=$STREAM_END" >> "$GITHUB_OUTPUT"

          else

            # ======================================================
            # THIS IS ACTION A
            #
            # The actual YouTube stream will start AFTER this
            # calculation.
            # ======================================================

            NOW=$(date +%s)

            STREAM_END=$((NOW + ${{ steps.video.outputs.duration_int }}))

            echo "========================================"
            echo "THIS IS ACTION A"
            echo "========================================"
            echo "Current epoch:"
            echo "$NOW"
            echo
            echo "Video duration:"
            echo "${{ steps.video.outputs.duration_int }} sec"
            echo
            echo "Expected stream end:"
            echo "$STREAM_END"
            echo "========================================"

            echo "stream_end=$STREAM_END" >> "$GITHUB_OUTPUT"

          fi

      # ============================================================
      # 7. START ACTION B
      #
      # ONLY ACTION A can start B.
      # B can NEVER start C.
      # ============================================================

      - name: Start Action B
        if: |
          success() &&
          (github.event.inputs.handoff_epoch == '0' ||
           github.event.inputs.handoff_epoch == '')

        env:
          GH_TOKEN: ${{ github.token }}

        shell: bash
        run: |
          set -e

          STREAM_END="${{ steps.timing.outputs.stream_end }}"

          echo "========================================"
          echo "STARTING ACTION B"
          echo "========================================"
          echo "Previous stream will end at:"
          echo "$STREAM_END"
          echo "========================================"

          gh workflow run stream-chain-test.yml \
            --repo "${GITHUB_REPOSITORY}" \
            -f handoff_epoch="$STREAM_END"

          echo
          echo "ACTION B DISPATCHED."

      # ============================================================
      # 8. ACTION B WAITS FOR ACTION A
      #
      # ACTION A also passes through this step, but its end time
      # is calculated from its own duration.
      # ============================================================

      - name: Wait until stream handoff
        shell: bash
        run: |
          set -e

          STREAM_END="${{ steps.timing.outputs.stream_end }}"

          IS_ACTION_B="${{ github.event.inputs.handoff_epoch }}"

          echo "========================================"
          echo "WAITING FOR HANDOFF"
          echo "========================================"
          echo "Expected end time: $STREAM_END"
          echo "========================================"

          while true; do

            NOW=$(date +%s)
            REMAINING=$((STREAM_END - NOW))

            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            echo "Remaining: ${REMAINING} sec"

            sleep 5

          done

          echo
          echo "========================================"
          echo "HANDOFF TIME REACHED"
          echo "========================================"

      # ============================================================
      # 9. SMALL SAFETY DELAY
      #
      # This is important.
      #
      # We do NOT start B at the exact same second that A ends.
      # We give YouTube a few seconds to close the previous RTMP
      # connection.
      # ============================================================

      - name: RTMP safety delay
        shell: bash
        run: |
          echo "Waiting 5 seconds for previous RTMP connection to close..."
          sleep 5
          echo "RTMP safety delay complete."

      # ============================================================
      # 10. START YOUTUBE
      # ============================================================

      - name: Start YouTube stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        shell: bash
        run: |
          set -e

          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "ERROR: YOUTUBE_STREAM_KEY secret is empty"
            exit 1
          fi

          echo "========================================"
          echo "STARTING YOUTUBE STREAM"
          echo "========================================"
          echo "Duration: ${{ steps.video.outputs.duration }} sec"
          echo "Video: copy"
          echo "Audio: copy"
          echo "========================================"

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -re \
            -i stream_video.mp4 \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"

      # ============================================================
      # 11. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        run: |
          rm -f stream_video.mp4
          echo "Downloaded video removed."
