
name: YouTube Stream

on:
  workflow_dispatch:
    inputs:
      handoff_epoch:
        description: "Unix timestamp when this video block should start"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  stream:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v2

      - name: Install FFmpeg
        shell: bash
        run: |
          set -e

          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"

            wget -q --show-progress \
              -O /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz

            tar -xJf /tmp/ffmpeg.tar.xz \
              --strip-components=1 \
              -C "$HOME/ffmpeg"

            rm -f /tmp/ffmpeg.tar.xz
          fi

      - name: Verify FFmpeg
        shell: bash
        run: |
          set -e

          "$HOME/ffmpeg/bin/ffmpeg" -version | head -n 1
          "$HOME/ffmpeg/bin/ffprobe" -version | head -n 1

      - name: Reserve random playlist of 10 videos
        id: reserve_playlist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          STATE_FILE="playlist_state.json"
          PLAYLIST_FILE="playlist.json"
          MAX_RETRIES=30

          python3 <<'PY'
          import json

          with open("playlist.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          videos = list(dict.fromkeys(data["videos"]))

          if len(videos) < 10:
              raise SystemExit(
                  f"Playlist contains only {len(videos)} unique videos. "
                  f"At least 10 are required."
              )

          with open("/tmp/master_playlist.json", "w", encoding="utf-8") as f:
              json.dump(videos, f, ensure_ascii=False, indent=2)
          PY

          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "Reservation attempt $attempt/$MAX_RETRIES"

            HTTP_CODE=$(curl -sS \
              -o /tmp/state_response.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/contents/$STATE_FILE")

            if [ "$HTTP_CODE" = "200" ]; then
              python3 <<'PY'
          import json
          import base64

          with open("/tmp/state_response.json", "r", encoding="utf-8") as f:
              response = json.load(f)

          content = base64.b64decode(response["content"]).decode("utf-8")
          state = json.loads(content)

          with open("/tmp/current_state.json", "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)

          with open("/tmp/state_sha.txt", "w", encoding="utf-8") as f:
              f.write(response["sha"])
          PY

            elif [ "$HTTP_CODE" = "404" ]; then
              python3 <<'PY'
          import json
          import random

          with open("/tmp/master_playlist.json", "r", encoding="utf-8") as f:
              videos = json.load(f)

          random.shuffle(videos)

          state = {
              "cycle": 1,
              "remaining": videos,
              "known": videos
          }

          with open("/tmp/current_state.json", "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)

          open("/tmp/state_sha.txt", "w").close()
          PY

            else
              echo "Failed to read playlist state. HTTP status: $HTTP_CODE"
              cat /tmp/state_response.json
              exit 1
            fi

            python3 <<'PY'
          import json
          import random

          with open("/tmp/master_playlist.json", "r", encoding="utf-8") as f:
              master = json.load(f)

          with open("/tmp/current_state.json", "r", encoding="utf-8") as f:
              state = json.load(f)

          # Remove duplicates from the current master playlist.
          master = list(dict.fromkeys(master))
          master_set = set(master)

          # Keep only URLs that still exist in playlist.json.
          original_remaining = state.get("remaining", [])
          if not isinstance(original_remaining, list):
              raise SystemExit("Invalid playlist state: 'remaining' must be a list.")

          remaining = list(dict.fromkeys(
              url for url in original_remaining if url in master_set
          ))

          cycle = state.get("cycle", 1)
          if not isinstance(cycle, int) or cycle < 1:
              cycle = 1

          # Find URLs that were added to playlist.json since the last reservation.
          known = state.get("known")
          if not isinstance(known, list):
              # Legacy state fallback: do not re-add all previously played URLs.
              known = list(remaining)

          known_set = set(known)
          new_videos = [
              url for url in master
              if url not in known_set
          ]

          # If the queue is exhausted, start a fresh cycle using the
          # current master playlist, including any newly added URLs.
          if not remaining:
              cycle += 1
              remaining = list(master)
              random.shuffle(remaining)

          else:
              # Insert newly added URLs at random positions among the
              # unreserved videos without reordering the existing queue.
              random.shuffle(new_videos)

              for url in new_videos:
                  position = random.randint(0, len(remaining))
                  remaining.insert(position, url)

          # Reserve up to 10 videos. The final block of a cycle may be shorter.
          selected = remaining[:10]
          new_remaining = remaining[10:]

          # Randomize playback order inside this reserved block.
          random.shuffle(selected)

          new_state = {
              "cycle": cycle,
              "remaining": new_remaining,
              "known": master
          }

          with open("/tmp/new_state.json", "w", encoding="utf-8") as f:
              json.dump(new_state, f, ensure_ascii=False, indent=2)

          with open("selected_playlist.json", "w", encoding="utf-8") as f:
              json.dump(
                  {"videos": selected},
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(f"Selected {len(selected)} videos:")
          for i, url in enumerate(selected, 1):
              print(f"{i:02d}. {url}")

          print("")
          print(f"Current cycle: {cycle}")
          print(f"New videos detected: {len(new_videos)}")
          print(f"Remaining after reservation: {len(new_remaining)}")
          PY

            CONTENT_B64=$(base64 -w 0 /tmp/new_state.json)

            if [ -s /tmp/state_sha.txt ]; then
              SHA=$(cat /tmp/state_sha.txt)

              PAYLOAD=$(python3 - <<PY
          import json

          payload = {
              "message": "Reserve videos for streaming Action #${GITHUB_RUN_NUMBER}",
              "content": "${CONTENT_B64}",
              "sha": "${SHA}",
              "branch": "${GITHUB_REF_NAME}"
          }

          print(json.dumps(payload))
          PY
              )
            else
              PAYLOAD=$(python3 - <<PY
          import json

          payload = {
              "message": "Initialize playlist state for streaming Action #${GITHUB_RUN_NUMBER}",
              "content": "${CONTENT_B64}",
              "branch": "${GITHUB_REF_NAME}"
          }

          print(json.dumps(payload))
          PY
              )
            fi

            UPDATE_CODE=$(curl -sS \
              -o /tmp/update_response.json \
              -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/contents/$STATE_FILE" \
              -d "$PAYLOAD")

            if [ "$UPDATE_CODE" = "200" ] || [ "$UPDATE_CODE" = "201" ]; then
              echo "Playlist reservation successfully committed."
              break
            fi

            if [ "$UPDATE_CODE" = "409" ] || [ "$UPDATE_CODE" = "422" ]; then
              echo "State may have changed concurrently. Retrying..."
              sleep 2
              continue
            fi

            echo "Failed to update playlist state. HTTP status: $UPDATE_CODE"
            cat /tmp/update_response.json
            exit 1
          done

          if [ "$UPDATE_CODE" != "200" ] && [ "$UPDATE_CODE" != "201" ]; then
            echo "Failed to reserve playlist after $MAX_RETRIES attempts."
            exit 1
          fi

      - name: Download 10 videos
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json

          with open("selected_playlist.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          videos = data["videos"]

          if not videos:
              raise SystemExit("Selected playlist is empty.")

          for i, url in enumerate(videos, 1):
              print(f"{i:02d} {url}")
          PY

          rm -f concat.txt

          python3 <<'PY'
          import json

          with open("selected_playlist.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          videos = data["videos"]

          with open("/tmp/download_list.txt", "w", encoding="utf-8") as f:
              for i, url in enumerate(videos, 1):
                  filename = f"stream_video_{i:02d}.mp4"
                  f.write(f"{i}|{filename}|{url}\n")
          PY

          while IFS='|' read -r NUMBER FILENAME URL; do
            echo ""
            echo "========================================"
            echo "Downloading video $NUMBER"
            echo "$FILENAME"
            echo "========================================"

            wget \
              --progress=dot:giga \
              -O "$FILENAME" \
              "$URL"

            test -s "$FILENAME"

          done < /tmp/download_list.txt

          echo ""
          echo "Creating concat list..."

          while IFS='|' read -r NUMBER FILENAME URL; do
            REALPATH="$(realpath "$FILENAME")"
            printf "file '%s'\n" "$REALPATH" >> concat.txt
          done < /tmp/download_list.txt

          echo ""
          cat concat.txt

      - name: Probe playlist durations
        id: durations
        shell: bash
        run: |
          set -euo pipefail

          TOTAL_EXACT=0

          echo ""
          echo "========================================"
          echo "VIDEO DURATIONS"
          echo "========================================"

          while IFS='|' read -r NUMBER FILENAME URL; do
            DURATION=$(
              "$HOME/ffmpeg/bin/ffprobe" \
                -v error \
                -show_entries format=duration \
                -of default=noprint_wrappers=1:nokey=1 \
                "$FILENAME"
            )

            echo "Video $NUMBER: $FILENAME"
            echo "Exact duration: $DURATION seconds"

            FLOOR_DURATION=$(
              python3 - "$DURATION" <<'PY'
          import sys
          import math

          duration = float(sys.argv[1])
          print(math.floor(duration))
          PY
            )

            echo "Rounded down: $FLOOR_DURATION seconds"

            TOTAL_EXACT=$(
              python3 - "$TOTAL_EXACT" "$DURATION" <<'PY'
          import sys

          total = float(sys.argv[1])
          duration = float(sys.argv[2])

          print(total + duration)
          PY
            )

          done < /tmp/download_list.txt

          TOTAL_FLOOR=$(
            python3 - "$TOTAL_EXACT" <<'PY'
          import sys
          import math

          total = float(sys.argv[1])
          print(math.floor(total))
          PY
          )

          echo ""
          echo "========================================"
          echo "TOTAL BLOCK DURATION"
          echo "========================================"
          echo "Exact total: $TOTAL_EXACT seconds"
          echo "Rounded down total: $TOTAL_FLOOR seconds"

          echo "TOTAL_EXACT=$TOTAL_EXACT" >> "$GITHUB_ENV"
          echo "TOTAL_FLOOR=$TOTAL_FLOOR" >> "$GITHUB_ENV"

      - name: Calculate timing
        shell: bash
        run: |
          set -euo pipefail

          NOW_EPOCH=$(date +%s)
          INPUT_HANDOFF="${{ inputs.handoff_epoch }}"

          if [ -z "$INPUT_HANDOFF" ] || [ "$INPUT_HANDOFF" = "0" ]; then
            START_EPOCH="$NOW_EPOCH"
          else
            START_EPOCH="$INPUT_HANDOFF"
          fi

          END_EPOCH=$((START_EPOCH + TOTAL_FLOOR))

          echo "NOW_EPOCH=$NOW_EPOCH"
          echo "START_EPOCH=$START_EPOCH"
          echo "END_EPOCH=$END_EPOCH"
          echo "BLOCK_DURATION=$TOTAL_FLOOR seconds"

          echo "START_EPOCH=$START_EPOCH" >> "$GITHUB_ENV"
          echo "END_EPOCH=$END_EPOCH" >> "$GITHUB_ENV"

      - name: Wait until block start
        shell: bash
        run: |
          set -euo pipefail

          while true; do
            NOW=$(date +%s)
            REMAINING=$((START_EPOCH - NOW))

            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            echo "Waiting $REMAINING seconds until block start..."
            sleep $(( REMAINING > 30 ? 30 : REMAINING ))
          done

      - name: Start FFmpeg stream
        shell: bash
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          set -euo pipefail

          echo "Starting single FFmpeg process..."
          echo "Block duration: $TOTAL_FLOOR seconds"
          echo "Start epoch: $START_EPOCH"
          echo "End epoch: $END_EPOCH"

          "$HOME/ffmpeg/bin/ffmpeg" \
            -hide_banner \
            -loglevel info \
            -re \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            > ffmpeg.log 2>&1 &

          FFMPEG_PID=$!

          echo "FFMPEG_PID=$FFMPEG_PID" >> "$GITHUB_ENV"

          echo "FFmpeg started with PID $FFMPEG_PID"

      - name: Dispatch next Action immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_START_EPOCH: ${{ env.END_EPOCH }}
        run: |
          set -euo pipefail

          echo "Dispatching next Action."
          echo "Next block start epoch: $NEXT_START_EPOCH"

          HTTP_CODE=$(curl -sS \
            -o /tmp/dispatch_response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/stream-chain-test.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"handoff_epoch\":\"${NEXT_START_EPOCH}\"}}")

          if [ "$HTTP_CODE" = "204" ]; then
            echo "Next Action dispatched successfully."
          else
            echo "Failed to dispatch next Action. HTTP status: $HTTP_CODE"
            cat /tmp/dispatch_response.json
            exit 1
          fi

      - name: Wait until block end
        shell: bash
        run: |
          set -euo pipefail

          while true; do
            NOW=$(date +%s)
            REMAINING=$((END_EPOCH - NOW))

            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            echo "Current block continues for $REMAINING seconds..."
            sleep $(( REMAINING > 30 ? 30 : REMAINING ))
          done

      - name: Stop FFmpeg
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${FFMPEG_PID:-}" ] && kill -0 "$FFMPEG_PID" 2>/dev/null; then
            echo "Stopping FFmpeg PID $FFMPEG_PID..."
            kill "$FFMPEG_PID" || true
            wait "$FFMPEG_PID" || true
          fi

          echo ""
          echo "========================================"
          echo "LAST FFmpeg LOG"
          echo "========================================"

          if [ -f ffmpeg.log ]; then
            tail -n 150 ffmpeg.log
          fi
