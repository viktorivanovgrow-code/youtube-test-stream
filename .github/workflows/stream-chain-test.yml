

          INPUT_HANDOFF="${{ inputs.handoff_epoch }}"

          if [ -z "$INPUT_HANDOFF" ] || [ "$INPUT_HANDOFF" = "0" ]; then
            START_EPOCH="$NOW_EPOCH"
          else
            START_EPOCH="$INPUT_HANDOFF"
          fi

          END_EPOCH=$((START_EPOCH + TOTAL_FLOOR))

          echo "NOW_EPOCH=$NOW_EPOCH"
          echo "START_EPOCH=$START_EPOCH"
          echo "END_EPOCH=$END_EPOCH"
          echo "BLOCK_DURATION=$TOTAL_FLOOR seconds"

          echo "START_EPOCH=$START_EPOCH" >> "$GITHUB_ENV"
          echo "END_EPOCH=$END_EPOCH" >> "$GITHUB_ENV"

      - name: Wait until block start
        shell: bash
        run: |
          set -euo pipefail

          while true; do
            NOW=$(date +%s)
            REMAINING=$((START_EPOCH - NOW))

            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            echo "Waiting $REMAINING seconds until block start..."
            sleep $(( REMAINING > 30 ? 30 : REMAINING ))
          done

      - name: Start FFmpeg stream
        shell: bash
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          set -euo pipefail

          echo "Starting single FFmpeg process..."
          echo "Block duration: $TOTAL_FLOOR seconds"
          echo "Start epoch: $START_EPOCH"
          echo "End epoch: $END_EPOCH"

          "$HOME/ffmpeg/bin/ffmpeg" \
            -hide_banner \
            -loglevel info \
            -re \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            > ffmpeg.log 2>&1 &

          FFMPEG_PID=$!

          echo "FFMPEG_PID=$FFMPEG_PID" >> "$GITHUB_ENV"

          echo "FFmpeg started with PID $FFMPEG_PID"

      - name: Dispatch next Action immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_START_EPOCH: ${{ env.END_EPOCH }}
        run: |
          set -euo pipefail

          echo "Dispatching next Action."
          echo "Next block start epoch: $NEXT_START_EPOCH"

          curl -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/stream-chain-test.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"handoff_epoch\":\"${NEXT_START_EPOCH}\"}}"

          echo ""
          echo "Next Action dispatched successfully."

      - name: Wait until block end
        shell: bash
        run: |
          set -euo pipefail

          while true; do
            NOW=$(date +%s)
            REMAINING=$((END_EPOCH - NOW))

            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            echo "Current block continues for $REMAINING seconds..."
            sleep $(( REMAINING > 30 ? 30 : REMAINING ))
          done

      - name: Stop FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${FFMPEG_PID:-}" ] && kill -0 "$FFMPEG_PID" 2>/dev/null; then
            echo "Stopping FFmpeg PID $FFMPEG_PID..."
            kill "$FFMPEG_PID" || true
            wait "$FFMPEG_PID" || true
          fi

          echo ""
          echo "========================================"
          echo "LAST FFmpeg LOG"
          echo "========================================"

          if [ -f ffmpeg.log ]; then
            tail -n 150 ffmpeg.log
          fi
