name: YouTube Stream Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v2

      - name: Install FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/ffmpeg"

          wget -q \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            -O /tmp/ffmpeg.tar.xz

          tar -xJf /tmp/ffmpeg.tar.xz \
            --strip-components=1 \
            -C "$HOME/ffmpeg"

      - name: Verify FFmpeg
        shell: bash
        run: |
          set -e

          "$HOME/ffmpeg/bin/ffmpeg" -version | head -n 1
          "$HOME/ffmpeg/bin/ffprobe" -version | head -n 1

      - name: Download two test videos
        shell: bash
        run: |
          set -e

          VIDEO1="https://huggingface.co/datasets/djSultry/YouTube/resolve/main/Afro%20Elements%20-%20Chocolat%20%28Mr%20Gone%27s%20Club%20Sandwich%29.mp4"

          VIDEO2="https://huggingface.co/datasets/djSultry/YouTube/resolve/main/Andy%20Caldwell%20-%20Live%20Your%20Life%20%28Fred%20Everything%20Mix%29.mp4"

          echo "Downloading Video 1..."
          wget \
            --progress=dot:giga \
            -O video1.mp4 \
            "$VIDEO1"

          echo "Downloading Video 2..."
          wget \
            --progress=dot:giga \
            -O video2.mp4 \
            "$VIDEO2"

          echo
          echo "Downloaded files:"
          ls -lh video1.mp4 video2.mp4

      - name: Check stream compatibility
        shell: bash
        run: |
          set -e

          echo "========== VIDEO 1 =========="

          "$HOME/ffmpeg/bin/ffprobe" \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,time_base,pix_fmt \
            -of default=noprint_wrappers=1 \
            video1.mp4

          "$HOME/ffmpeg/bin/ffprobe" \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels,time_base \
            -of default=noprint_wrappers=1 \
            video1.mp4

          echo
          echo "========== VIDEO 2 =========="

          "$HOME/ffmpeg/bin/ffprobe" \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,time_base,pix_fmt \
            -of default=noprint_wrappers=1 \
            video2.mp4

          "$HOME/ffmpeg/bin/ffprobe" \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels,time_base \
            -of default=noprint_wrappers=1 \
            video2.mp4

      - name: Create concat list
        shell: bash
        run: |
          set -e

          cat > concat.txt <<'EOF'
          ffconcat version 1.0
          file 'video1.mp4'
          file 'video2.mp4'
          EOF

          echo "========== CONCAT LIST =========="
          cat concat.txt

      - name: Start one continuous FFmpeg stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ONE FFMPEG"
          echo "ONE RTMP CONNECTION"
          echo "VIDEO 1 -> VIDEO 2"
          echo "========================================"

          "$HOME/ffmpeg/bin/ffmpeg" \
            -hide_banner \
            -loglevel info \
            -re \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            > ffmpeg.log 2>&1

      - name: Show FFmpeg log
        if: always()
        shell: bash
        run: |
          echo "========== FFMPEG LOG =========="

          if [ -f ffmpeg.log ]; then
            tail -n 200 ffmpeg.log
          else
            echo "ffmpeg.log not found"
          fi
