name: YouTube Stream

on:
  workflow_dispatch:
    inputs:
      handoff_epoch:
        description: "Unix timestamp when this video block should start"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  stream:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v2

      - name: Install FFmpeg
        shell: bash
        run: |
          set -e

          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"

            wget -q --show-progress \
              -O /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz

            tar -xJf /tmp/ffmpeg.tar.xz \
              --strip-components=1 \
              -C "$HOME/ffmpeg"

            rm -f /tmp/ffmpeg.tar.xz
          fi

      - name: Verify FFmpeg
        shell: bash
        run: |
          set -e

          "$HOME/ffmpeg/bin/ffmpeg" -version | head -n 1
          "$HOME/ffmpeg/bin/ffprobe" -version | head -n 1

      - name: Reserve random playlist of 10 videos
        id: reserve_playlist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          STATE_FILE="playlist_state.json"
          PLAYLIST_FILE="playlist.json"
          MAX_RETRIES=30

          python3 <<'PY'
                
          import json
          import os
          import sys

          path = "playlist.json"

          print(f"Working directory: {os.getcwd()}")
          print(f"Playlist path: {os.path.abspath(path)}")

          if not os.path.isfile(path):
              sys.exit("ERROR: playlist.json not found in repository root.")

          if os.path.getsize(path) == 0:
              sys.exit("ERROR: playlist.json is empty (0 bytes).")

          try:
              with open(path, "r", encoding="utf-8-sig") as f:
                  data = json.load(f)
          except json.JSONDecodeError as e:
              sys.exit(
                  f"ERROR: playlist.json contains invalid JSON: "
                  f"line {e.lineno}, column {e.colno}: {e.msg}"
              )

          videos = data.get("videos") if isinstance(data, dict) else None
