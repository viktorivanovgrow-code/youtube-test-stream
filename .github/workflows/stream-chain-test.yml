name: Stream Watchdog

# Сторож: если вся цепочка трансляции умерла (нет ни одного активного запуска),
# через несколько минут запускает её заново.
# Чтобы ОСТАНОВИТЬ трансляцию намеренно: Settings -> Secrets and variables -> Actions -> Variables,
# создайте переменную STREAM_ENABLED = false и отмените активные запуски стрима.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: stream-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Restart chain if dead
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STREAM_ENABLED: ${{ vars.STREAM_ENABLED }}
          WF: stream-chain-test.yml
        run: |
          set -euo pipefail

          if [ "${STREAM_ENABLED:-true}" = "false" ]; then
            echo "STREAM_ENABLED=false: watchdog is paused."
            exit 0
          fi

          count_active() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?per_page=50" \
              --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length'
          }

          ACTIVE=$(count_active)
          echo "Active stream runs: $ACTIVE"

          if [ "$ACTIVE" != "0" ]; then
            echo "Chain is alive."
            exit 0
          fi

          # Повторная проверка: исключаем короткий момент смены блоков
          echo "No active runs. Re-checking in 90 seconds..."
          sleep 90

          ACTIVE=$(count_active)
          echo "Active stream runs after re-check: $ACTIVE"

          if [ "$ACTIVE" != "0" ]; then
            echo "Chain is alive."
            exit 0
          fi

          echo "Chain is dead. Restarting..."
          gh workflow run "$WF" --repo "$GITHUB_REPOSITORY" -f handoff_epoch=0 -f retry_count=0
