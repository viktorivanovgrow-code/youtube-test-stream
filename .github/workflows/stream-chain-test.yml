name: YouTube Stream

on:
  workflow_dispatch:
    inputs:
      handoff_epoch:
        description: "Unix timestamp when this video block should start"
        required: false
        default: "0"
      previous_run_id:
        description: "ID of the previous streaming workflow run"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  stream:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v2

      - name: Install FFmpeg
        shell: bash
        run: |
          set -e

          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"

            wget -q --show-progress \
              -O /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz

            tar -xJf /tmp/ffmpeg.tar.xz \
              --strip-components=1 \
              -C "$HOME/ffmpeg"

            rm -f /tmp/ffmpeg.tar.xz
          fi

      - name: Verify FFmpeg
        shell: bash
        run: |
          set -e

          "$HOME/ffmpeg/bin/ffmpeg" -version | head -n 1
          "$HOME/ffmpeg/bin/ffprobe" -version | head -n 1

      - name: Reserve random playlist of 10 videos
        id: reserve_playlist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          STATE_FILE="playlist_state.json"
          PLAYLIST_FILE="playlist.json"
          MAX_RETRIES=30

          python3 <<'PY'
          import json
          import random

          with open("playlist.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          videos = data["videos"]

          if len(videos) < 10:
              raise SystemExit(
                  f"Playlist contains only {len(videos)} videos. "
                  f"At least 10 are required."
              )

          with open("/tmp/master_playlist.json", "w", encoding="utf-8") as f:
              json.dump(videos, f, ensure_ascii=False, indent=2)
          PY

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Reservation attempt $attempt/$MAX_RETRIES"

            HTTP_CODE=$(curl -sS \
              -o /tmp/state_response.json \
