
          echo "FFMPEG_PID=$FFMPEG_PID" >> "$GITHUB_ENV"

          echo "FFmpeg started with PID $FFMPEG_PID"

      - name: Dispatch next Action immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_START_EPOCH: ${{ env.END_EPOCH }}
        run: |
          set -euo pipefail

          echo "Dispatching next Action."
          echo "Next block start epoch: $NEXT_START_EPOCH"

          curl -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/stream-chain-test.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"handoff_epoch\":\"${NEXT_START_EPOCH}\",\"previous_run_id\":\"${GITHUB_RUN_ID}\"}}"

          echo ""
          echo "Next Action dispatched successfully."

      - name: Wait until next playlist is ready
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          READY_FILE="stream_ready.json"

          echo "Current playlist will repeat as needed and remain active until the planned block end and the next playlist is ready."
          NEXT_PLAYLIST_READY=0

          while true; do
            NOW=$(date +%s)

            if [ "$NOW" -ge "$END_EPOCH" ] && [ "$NEXT_PLAYLIST_READY" -eq 1 ]; then
              echo "Planned block end reached and next playlist is ready."
              break
            fi

            HTTP_CODE=$(curl -sS \
              -o /tmp/ready_poll_response.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/contents/$READY_FILE")

            if [ "$HTTP_CODE" = "200" ]; then
              MATCH=$(python3 - <<'PY'
          import base64
          import json

          with open("/tmp/ready_poll_response.json", "r", encoding="utf-8") as f:
              response = json.load(f)
          content = base64.b64decode(response["content"]).decode("utf-8")
          marker = json.loads(content)
          print("yes" if str(marker.get("previous_run_id")) == str(__import__("os").environ["GITHUB_RUN_ID"]) else "no")
          PY
              )

              if [ "$MATCH" = "yes" ]; then
                if [ "$NEXT_PLAYLIST_READY" -eq 0 ]; then
                  echo "The next playlist is ready."
                fi
                NEXT_PLAYLIST_READY=1
              fi
            else
              echo "Ready marker not available yet (HTTP $HTTP_CODE)."
            fi

            sleep 10
          done

      - name: Stop FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${FFMPEG_PID:-}" ] && kill -0 "$FFMPEG_PID" 2>/dev/null; then
            echo "Stopping FFmpeg PID $FFMPEG_PID..."
            kill "$FFMPEG_PID" || true
            wait "$FFMPEG_PID" || true
          fi

          echo ""
          echo "========================================"
          echo "LAST FFmpeg LOG"
          echo "========================================"

          if [ -f ffmpeg.log ]; then
            tail -n 150 ffmpeg.log
          fi
