name: YouTube Stream Chain Test

on:
  workflow_dispatch:
    inputs:
      handoff_epoch:
        description: "Unix timestamp when this action should start FFmpeg"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Install FFmpeg
      # ------------------------------------------------------------
      - name: Restore FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1

      - name: Download FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg

          wget -q \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            -O /tmp/ffmpeg.tar.xz

          tar -xf /tmp/ffmpeg.tar.xz -C ~/ffmpeg --strip-components=1

      - name: Add FFmpeg to PATH
        run: |
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"


      # ------------------------------------------------------------
      # 3. Select random video
      # ------------------------------------------------------------
      - name: Select random video
        id: select
        run: |
          VIDEO_URL=$(python3 - <<'PY'
          import json
          import random

          with open("playlist.json", "r", encoding="utf-8") as f:
              playlist = json.load(f)

          print(random.choice(playlist))
          PY
          )

          echo "VIDEO_URL=$VIDEO_URL" >> "$GITHUB_ENV"

          echo "Selected video:"
          echo "$VIDEO_URL"


      # ------------------------------------------------------------
      # 4. Download video completely
      # ------------------------------------------------------------
      - name: Download video
        run: |
          rm -f stream_video.mp4

          wget \
            --progress=dot:giga \
            "$VIDEO_URL" \
            -O stream_video.mp4

          echo
          echo "Downloaded:"
          ls -lh stream_video.mp4


      # ------------------------------------------------------------
      # 5. Probe actual duration
      # ------------------------------------------------------------
      - name: Get video duration
        id: probe
        run: |
          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            stream_video.mp4)

          DURATION_INT=$(printf "%.0f" "$DURATION")

          echo "Exact duration: $DURATION seconds"
          echo "Rounded duration: $DURATION_INT seconds"

          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "duration_int=$DURATION_INT" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # 6. Calculate timing
      # ------------------------------------------------------------
      - name: Calculate timing
        id: timing
        env:
          INPUT_HANDOFF: ${{ inputs.handoff_epoch }}
          DURATION_INT: ${{ steps.probe.outputs.duration_int }}
        run: |
          # ==========================================================
          # SETTINGS
          # ==========================================================

          PREP_LEAD=180
          OVERLAP=15

          echo "Preparation lead: ${PREP_LEAD}s"
          echo "Overlap: ${OVERLAP}s"

          # ==========================================================
          # START TIME
          # ==========================================================

          if [ "$INPUT_HANDOFF" = "0" ]; then
            START_EPOCH=$(date +%s)
            echo "This is the first action."
            echo "Starting immediately."
          else
            START_EPOCH="$INPUT_HANDOFF"
            echo "This is a chained action."
            echo "Scheduled start: $START_EPOCH"
          fi

          # ==========================================================
          # END TIME
          # ==========================================================

          END_EPOCH=$((START_EPOCH + DURATION_INT))

          # ==========================================================
          # NEXT ACTION START
          #
          # Next Action is launched 180 sec before our end.
          # But it actually starts FFmpeg 15 sec before our end.
          # ==========================================================

          B_START_EPOCH=$((END_EPOCH - OVERLAP))

          DISPATCH_EPOCH=$((END_EPOCH - PREP_LEAD))

          # If the video is shorter than PREP_LEAD,
          # dispatch the next Action immediately.
          if [ "$DISPATCH_EPOCH" -lt "$START_EPOCH" ]; then
            DISPATCH_EPOCH="$START_EPOCH"
          fi

          echo
          echo "=========================================="
          echo "TIMING"
          echo "=========================================="
          echo "START:           $START_EPOCH"
          echo "END:             $END_EPOCH"
          echo "NEXT PREP:       $DISPATCH_EPOCH"
          echo "NEXT FFmpeg:     $B_START_EPOCH"
          echo "PREP LEAD:       ${PREP_LEAD}s"
          echo "OVERLAP:         ${OVERLAP}s"
          echo "=========================================="

          echo "start_epoch=$START_EPOCH" >> "$GITHUB_OUTPUT"
          echo "end_epoch=$END_EPOCH" >> "$GITHUB_OUTPUT"
          echo "dispatch_epoch=$DISPATCH_EPOCH" >> "$GITHUB_OUTPUT"
          echo "next_start_epoch=$B_START_EPOCH" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # 7. Wait for scheduled start
      # ------------------------------------------------------------
      - name: Wait for scheduled start
        env:
          START_EPOCH: ${{ steps.timing.outputs.start_epoch }}
        run: |
          echo "Waiting for scheduled start..."

          while true; do
            NOW=$(date +%s)
            REMAIN=$((START_EPOCH - NOW))

            if [ "$REMAIN" -le 0 ]; then
              break
            fi

            echo "Starts in ${REMAIN}s"
            sleep 5
          done

          echo "START TIME REACHED."


      # ------------------------------------------------------------
      # 8. Start FFmpeg
      # ------------------------------------------------------------
      - name: Start YouTube stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          echo "Starting FFmpeg..."

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -re \
            -i stream_video.mp4 \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            > ffmpeg.log 2>&1 &

          FFMPEG_PID=$!

          echo "$FFMPEG_PID" > ffmpeg.pid

          echo "FFmpeg PID: $FFMPEG_PID"


      # ------------------------------------------------------------
      # 9. Wait until it is time to prepare next Action
      # ------------------------------------------------------------
      - name: Wait until next Action preparation
        env:
          DISPATCH_EPOCH: ${{ steps.timing.outputs.dispatch_epoch }}
          END_EPOCH: ${{ steps.timing.outputs.end_epoch }}
        run: |
          echo "Waiting until next Action preparation time..."

          while true; do
            NOW=$(date +%s)
            REMAIN=$((DISPATCH_EPOCH - NOW))

            if [ "$REMAIN" -le 0 ]; then
              break
            fi

            echo "Next Action will be prepared in ${REMAIN}s"
            sleep 10
          done


      # ------------------------------------------------------------
      # 10. Dispatch next Action
      # ------------------------------------------------------------
      - name: Dispatch next Action
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_START_EPOCH: ${{ steps.timing.outputs.next_start_epoch }}
        run: |
          echo "=========================================="
          echo "PREPARING NEXT ACTION"
          echo "=========================================="

          echo "Next FFmpeg start:"
          date -d "@$NEXT_START_EPOCH"

          echo
          echo "Dispatching next workflow..."

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/stream-chain-test.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"handoff_epoch\":\"$NEXT_START_EPOCH\"}}"

          echo
          echo "Next Action dispatched."


      # ------------------------------------------------------------
      # 11. Wait until current video ends
      # ------------------------------------------------------------
      - name: Wait until current video ends
        env:
          END_EPOCH: ${{ steps.timing.outputs.end_epoch }}
        run: |
          echo
          echo "=========================================="
          echo "CURRENT STREAM"
          echo "=========================================="

          while true; do
            NOW=$(date +%s)
            REMAIN=$((END_EPOCH - NOW))

            if [ "$REMAIN" -le 0 ]; then
              break
            fi

            echo "Current video ends in ${REMAIN}s"

            sleep 10
          done

          echo
          echo "CURRENT VIDEO END TIME REACHED."


      # ------------------------------------------------------------
      # 12. Stop current FFmpeg
      # ------------------------------------------------------------
      - name: Stop current FFmpeg
        run: |
          if [ -f ffmpeg.pid ]; then

            PID=$(cat ffmpeg.pid)

            echo "Stopping FFmpeg PID: $PID"

            kill "$PID" 2>/dev/null || true

            sleep 2

            kill -9 "$PID" 2>/dev/null || true

          fi


      # ------------------------------------------------------------
      # 13. Show FFmpeg log
      # ------------------------------------------------------------
      - name: Show FFmpeg log
        if: always()
        run: |
          echo
          echo "=========================================="
          echo "FFMPEG LOG"
          echo "=========================================="

          if [ -f ffmpeg.log ]; then
            tail -100 ffmpeg.log
          else
            echo "No FFmpeg log found."
          fi
