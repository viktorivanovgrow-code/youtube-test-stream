name: Session 1

on:
  workflow_dispatch:
    inputs:
      handoff_epoch:
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:

      # ---------------------------------------------------------
      # 1. Restore FFmpeg cache
      # ---------------------------------------------------------
      - name: Restore FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1

      # ---------------------------------------------------------
      # 2. Download FFmpeg only if cache is empty
      # ---------------------------------------------------------
      - name: Download FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg

          wget -q \
            https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz \
            -O /tmp/ffmpeg.tar.xz

          tar -xf /tmp/ffmpeg.tar.xz -C /tmp

          FF_DIR=$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-master-latest-linux64-gpl')

          cp "$FF_DIR/bin/ffmpeg" ~/ffmpeg/ffmpeg
          cp "$FF_DIR/bin/ffprobe" ~/ffmpeg/ffprobe

          chmod +x ~/ffmpeg/ffmpeg
          chmod +x ~/ffmpeg/ffprobe

      # ---------------------------------------------------------
      # 3. Save FFmpeg cache
      # ---------------------------------------------------------
      - name: Save FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1

      # ---------------------------------------------------------
      # 4. Wait for handoff time
      # ---------------------------------------------------------
      - name: Wait for handoff
        if: inputs.handoff_epoch != '0'
        run: |
          NOW=$(date +%s)
          WAIT=$(( ${{ inputs.handoff_epoch }} - NOW ))

          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting $WAIT seconds until handoff..."
            sleep "$WAIT"
          fi

      # ---------------------------------------------------------
      # 5. Start next Action after 3 minutes
      # ---------------------------------------------------------
      - name: Schedule Session 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 180

          HANDOFF=$(( $(date +%s) + 180 ))

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/session2.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"handoff_epoch\":\"$HANDOFF\"}}"

      # ---------------------------------------------------------
      # 6. Stream directly from Hugging Face
      # ---------------------------------------------------------
      - name: Stream Video 1
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ~/ffmpeg/ffmpeg \
            -re \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_on_network_error 1 \
            -reconnect_on_http_error 5xx \
            -reconnect_delay_max 5 \
            -i "https://huggingface.co/viktorgrow/my-video-storage/resolve/main/vinyl_test_1.mp4" \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"
