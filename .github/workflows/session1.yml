name: Session 1

on:
  workflow_dispatch:
    inputs:
      handoff_epoch:
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:

      # ---------------------------------------------------------
      # 1. Restore FFmpeg cache
      # ---------------------------------------------------------
      - name: Restore FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1

      # ---------------------------------------------------------
      # 2. Download FFmpeg if cache is empty
      # ---------------------------------------------------------
      - name: Download FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg

          wget -q \
            https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz \
            -O /tmp/ffmpeg.tar.xz

          tar -xf /tmp/ffmpeg.tar.xz -C /tmp

          FF_DIR=$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-master-latest-linux64-gpl')

          cp "$FF_DIR/bin/ffmpeg" ~/ffmpeg/ffmpeg
          cp "$FF_DIR/bin/ffprobe" ~/ffmpeg/ffprobe

          chmod +x ~/ffmpeg/ffmpeg
          chmod +x ~/ffmpeg/ffprobe

      # ---------------------------------------------------------
      # 3. Save FFmpeg cache
      # ---------------------------------------------------------
      - name: Save FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1

      # ---------------------------------------------------------
      # 4. Download Video 1
      # ---------------------------------------------------------
      - name: Download Video 1
        run: |
          wget -q --show-progress \
            "https://huggingface.co/viktorgrow/my-video-storage/resolve/main/vinyl_test_1.mp4" \
            -O video1.mp4

          ls -lh video1.mp4

      # ---------------------------------------------------------
      # 5. Wait for assigned handoff time
      # ---------------------------------------------------------
      - name: Wait for handoff
        if: inputs.handoff_epoch != '0'
        run: |
          NOW=$(date +%s)
          WAIT=$(( ${{ inputs.handoff_epoch }} - NOW ))

          echo "Current time: $NOW"
          echo "Handoff time: ${{ inputs.handoff_epoch }}"
          echo "Waiting: $WAIT seconds"

          if [ "$WAIT" -gt 0 ]; then
            sleep "$WAIT"
          fi

      # ---------------------------------------------------------
      # 6. Start Video 1 immediately
      # ---------------------------------------------------------
      - name: Start Video 1
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ~/ffmpeg/ffmpeg \
            -re \
            -i video1.mp4 \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            > ffmpeg.log 2>&1 &

          echo $! > ffmpeg.pid

          echo "FFmpeg started with PID $(cat ffmpeg.pid)"

      # ---------------------------------------------------------
      # 7. After 3 minutes start preparing Session 2
      # ---------------------------------------------------------
      - name: Schedule Session 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 180

          # Session 2 will start at 5:30
          HANDOFF=$(( $(date +%s) + 150 ))

          echo "Starting Session 2"
          echo "Session 2 handoff epoch: $HANDOFF"

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/session2.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"handoff_epoch\":\"$HANDOFF\"}}"

      # ---------------------------------------------------------
      # 8. Keep current stream alive until 6 minutes
      # ---------------------------------------------------------
      - name: Keep Session 1 alive
        run: |
          sleep 150

      # ---------------------------------------------------------
      # 9. Stop current stream
      # ---------------------------------------------------------
      - name: Stop Session 1
        run: |
          if [ -f ffmpeg.pid ]; then
            PID=$(cat ffmpeg.pid)

            if kill -0 "$PID" 2>/dev/null; then
              echo "Stopping FFmpeg PID $PID"
              kill "$PID"
              wait "$PID" 2>/dev/null || true
            fi
          fi

          echo "Session 1 finished."
