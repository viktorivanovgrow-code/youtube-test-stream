name: Test Playlist

on:
  workflow_dispatch:

jobs:
  test-playlist:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Select random video
        id: select
        shell: bash
        run: |
          set -euo pipefail

          echo "Playlist contents:"
          cat playlist.json
          echo

          VIDEO_URL=$(python3 - <<'PY'
          import json
          import random

          with open("playlist.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          videos = data["videos"]

          if not videos:
              raise SystemExit("ERROR: playlist.json is empty")

          print(random.choice(videos))
          PY
          )

          echo "Selected video:"
          echo "$VIDEO_URL"

          echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"

      - name: Download selected video
        shell: bash
        run: |
          set -euo pipefail

          URL='${{ steps.select.outputs.video_url }}'

          echo "Downloading:"
          echo "$URL"
          echo

          START=$(date +%s)

          wget \
            --progress=bar:force:noscroll \
            --tries=3 \
            --timeout=30 \
            -O test_video.mp4 \
            "$URL"

          END=$(date +%s)
          ELAPSED=$((END - START))

          if [ "$ELAPSED" -lt 1 ]; then
            ELAPSED=1
          fi

          BYTES=$(stat -c%s test_video.mp4)
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES / 1000000}")
          MIB=$(awk "BEGIN {printf \"%.2f\", $BYTES / 1048576}")
          SPEED_MB=$(awk "BEGIN {printf \"%.2f\", $BYTES / $ELAPSED / 1000000}")
          SPEED_MIB=$(awk "BEGIN {printf \"%.2f\", $BYTES / $ELAPSED / 1048576}")

          echo
          echo "========================================"
          echo "DOWNLOAD RESULT"
          echo "========================================"
          echo "Time:       ${ELAPSED} sec"
          echo "Size:       ${MB} MB (${MIB} MiB)"
          echo "Speed:      ${SPEED_MB} MB/s (${SPEED_MIB} MiB/s)"
          echo "========================================"

      - name: Analyze video with ffprobe
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo "VIDEO INFORMATION"
          echo "========================================"

          ffprobe \
            -v error \
            -show_entries format=filename,size,duration \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,bit_rate,pix_fmt,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            test_video.mp4

          echo "========================================"

      - name: Check disk space
        run: |
          echo
          echo "========================================"
          echo "DISK SPACE"
          echo "========================================"
          df -h /
          echo "========================================"

      - name: Cleanup
        if: always()
        run: |
          rm -f test_video.mp4
          echo "Downloaded video removed."
