name: Session 3

on:
  workflow_dispatch:
    inputs:
      handoff_epoch:
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:

      - name: Restore FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1

      - name: Download FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg

          wget -q \
            https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz \
            -O /tmp/ffmpeg.tar.xz

          tar -xf /tmp/ffmpeg.tar.xz -C /tmp

          FF_DIR=$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-master-latest-linux64-gpl')

          cp "$FF_DIR/bin/ffmpeg" ~/ffmpeg/ffmpeg
          cp "$FF_DIR/bin/ffprobe" ~/ffmpeg/ffprobe

          chmod +x ~/ffmpeg/ffmpeg
          chmod +x ~/ffmpeg/ffprobe

      - name: Save FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1

      # ---------------------------------------------------------
      # Download Video 3
      # ---------------------------------------------------------
      - name: Download Video 3
        run: |
          wget -q --show-progress \
            "https://huggingface.co/viktorgrow/my-video-storage/resolve/main/vinyl_test_3.mp4" \
            -O video3.mp4

          ls -lh video3.mp4

      # ---------------------------------------------------------
      # Wait for Session 3 handoff
      # ---------------------------------------------------------
      - name: Wait for handoff
        if: inputs.handoff_epoch != '0'
        run: |
          NOW=$(date +%s)
          WAIT=$(( ${{ inputs.handoff_epoch }} - NOW ))

          echo "Current time: $NOW"
          echo "Handoff time: ${{ inputs.handoff_epoch }}"
          echo "Waiting: $WAIT seconds"

          if [ "$WAIT" -gt 0 ]; then
            sleep "$WAIT"
          fi

      # ---------------------------------------------------------
      # Start Video 3
      # ---------------------------------------------------------
      - name: Start Video 3
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ~/ffmpeg/ffmpeg \
            -re \
            -i video3.mp4 \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            > ffmpeg.log 2>&1 &

          echo $! > ffmpeg.pid

          echo "FFmpeg started with PID $(cat ffmpeg.pid)"

      # ---------------------------------------------------------
      # Start Session 1 preparation after 3 minutes
      # ---------------------------------------------------------
      - name: Schedule Session 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 180

          # Session 1 starts 30 seconds before Session 3 ends
          HANDOFF=$(( $(date +%s) + 150 ))

          echo "Starting Session 1"
          echo "Session 1 handoff epoch: $HANDOFF"

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/session1.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"handoff_epoch\":\"$HANDOFF\"}}"

      # ---------------------------------------------------------
      # Keep stream alive
      # ---------------------------------------------------------
      - name: Keep Session 3 alive
        run: |
          sleep 150

      # ---------------------------------------------------------
      # Stop Session 3
      # ---------------------------------------------------------
      - name: Stop Session 3
        run: |
          if [ -f ffmpeg.pid ]; then
            PID=$(cat ffmpeg.pid)

            if kill -0 "$PID" 2>/dev/null; then
              echo "Stopping FFmpeg PID $PID"
              kill "$PID"
              wait "$PID" 2>/dev/null || true
            fi
          fi

          echo "Session 3 finished."
