name: 24/7 YouTube Stream

on:
  schedule:
    # Автоматический перезапуск каждые 5 часов
    - cron: '0 */5 * * *'
  workflow_dispatch: # Позволяет запускать стрим вручную кнопкой

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download Video and Start Streaming
      env:
        STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        # Сюда вставлена именно ВАША ссылка с заменой на dl=1
        VIDEO_URL: "https://www.dropbox.com/scl/fi/81la8lrpq116d1ipwqzv6/TEST-STEAR.mp4?rlkey=m72y4tjna6ckokpjt4r3h6t0r&st=6o7i37iu&dl=1"
      run: |
        echo "Скачивание видео..."
        curl -L -o input.mp4 "$VIDEO_URL"
        
        echo "Запуск трансляции..."
        # Запуск ffmpeg на 5 часов 40 минут (20400 сек) в бесконечном цикле
        timeout 20400 ffmpeg -re -stream_loop -1 -i input.mp4 \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://://youtube.com"
