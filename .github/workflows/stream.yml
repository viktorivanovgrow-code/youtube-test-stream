name: 24/7 YouTube Stream

on:
  schedule:
    # Автоматический перезапуск каждые 5 часов
    - cron: '0 */5 * * *'
  workflow_dispatch: # Позволяет запускать стрим вручную кнопкой

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download Video and Start Streaming
      env:
        STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        # ВСТАВЬТЕ СЮДА ВАШ ID ИЗ GOOGLE ДИСКА
        GOOGLE_DRIVE_ID: "1N7l2CCjQO97lxPzbYgG3qbeGfIjoecYk"
      run: |
        echo "=== СКАЧИВАНИЕ ТЯЖЕЛОГО ВИДЕО С GOOGLE DRIVE ==="
        # Обход предупреждения Google Диска о большом размере файла
        curl -c cookies.txt -s -L "https://google.com" > confirm.html
        CONFIRM_CODE=$(grep -o 'confirm=[^&]*' confirm.html | head -n 1)
        
        if [ -n "$CONFIRM_CODE" ]; then
          echo "Обнаружен код подтверждения: $CONFIRM_CODE. Скачиваем оригинал..."
          curl -b cookies.txt -L "https://google.com" -o input.mp4
        else
          echo "Прямое скачивание без подтверждения..."
          curl -L "https://google.com" -o input.mp4
        fi
        
        echo "=== ПРОВЕРКА РАЗМЕРА ФАЙЛА ==="
        ls -lh input.mp4
        
        if [ $(stat -c%s input.mp4) -lt 1000000 ]; then
          echo "Ошибка: Файл подозрительно маленький (меньше 1 МБ). Стрим не запустится."
          exit 1
        fi
        
        echo "=== ЗАПУСК ТРАНСЛЯЦИИ НА YOUTUBE ==="
        timeout 20400 ffmpeg -re -stream_loop -1 -i input.mp4 \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://://youtube.com"
