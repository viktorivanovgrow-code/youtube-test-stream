name: 24/7 YouTube Stream

on:
  schedule:
    # Автоматический перезапуск каждые 5 часов
    - cron: '0 */5 * * *'
  workflow_dispatch: # Позволяет запускать стрим вручную кнопкой

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download Video and Start Streaming
      env:
        STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        # ВАША ОРИГИНАЛЬНАЯ ССЫЛКА:
        ORIGINAL_URL: "https://www.dropbox.com/scl/fi/81la8lrpq116d1ipwqzv6/TEST-STEAR.mp4?rlkey=m72y4tjna6ckokpjt4r3h6t0r&st=6o7i37iu&dl=0"
      run: |
        echo "=== ПОДГОТОВКА ССЫЛКИ ==="
        # Скрипт автоматически преобразует вашу ссылку в прямой поток для скачивания
        VIDEO_URL=$(echo "$ORIGINAL_URL" | sed 's/://dropbox.com' | sed 's/&dl=0//')
        
        echo "=== СКАЧИВАНИЕ ВИДЕО ==="
        curl -L -o input.mp4 "$VIDEO_URL"
        
        echo "=== ПРОВЕРКА РАЗМЕРА ФАЙЛА ==="
        ls -lh input.mp4
        
        if [ ! -s input.mp4 ]; then
          echo "Ошибка: Файл пустой, скачивание сорвалось!"
          exit 1
        fi
        
        echo "=== ЗАПУСК ТРАНСЛЯЦИИ НА YOUTUBE ==="
        timeout 20400 ffmpeg -re -stream_loop -1 -i input.mp4 \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://://youtube.com"
