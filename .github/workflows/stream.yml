name: 24/7 YouTube Stream

on:
  schedule:
    # Перезапуск каждые 5 часов автоматически
    - cron: '0 */5 * * *'
  workflow_dispatch: # Позволяет запускать стрим вручную кнопкой

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download Video and Start Streaming
      run: |
        echo "=== СКАЧИВАНИЕ ВИДЕО ==="
        # Замените ссылку ниже на вашу прямую ссылку скачивания видео с Hugging Face
        VIDEO_URL="ВСТАВЬТЕ_СЮДА_ВАШУ_ССЫЛКУ_DOWNLOAD"
        curl -L -o input.mp4 "$VIDEO_URL"
        
        echo "=== ПРОВЕРКА РАЗМЕРА ФАЙЛА ==="
        ls -lh input.mp4
        
        echo "=== ЗАПУСК ТРАНСЛЯЦИИ НА YOUTUBE ==="
        # ВСТАВЬТЕ ВАШ КЛЮЧ ТРАНСЛЯЦИИ ВМЕСТО СЛОВ: vash-kluch-iz-youtube
        # Секретный ключ должен быть внутри кавычек сразу после live2/
        timeout 20400 ffmpeg -re -stream_loop -1 -i input.mp4 \
          -c:v copy -c:a copy \
          -f flv "rtmp://://youtube.com"
