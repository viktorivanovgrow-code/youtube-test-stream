name: YouTube Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download video
        run: |
          wget -O video.mp4 \
          "https://huggingface.co/spaces/viktorgrow/my-video-storage/resolve/main/TEST%20STEAR.mp4"

          ls -lh video.mp4

      - name: Start YouTube Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ffmpeg \
            -re \
            -stream_loop -1 \
            -i video.mp4 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 6000k \
            -maxrate 6000k \
            -bufsize 12000k \
            -pix_fmt yuv420p \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            -c:a copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"

      - name: Restart same Action
        if: always()
        env:
          GH_RESTART_TOKEN: ${{ secrets.GH_RESTART_TOKEN }}
        run: |
          echo "Starting next instance of the same workflow..."

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_RESTART_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/youtube.yml/dispatches \
            -d '{"ref":"main"}'

          echo "Next instance requested."
