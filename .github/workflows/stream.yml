name: YouTube Playlist Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ==========================================================
      # 1. Install FFmpeg
      # ==========================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version
          ffprobe -version


      # ==========================================================
      # 2. Download videos from Hugging Face
      # ==========================================================

      - name: Download videos
        run: |
          set -e

          echo "=========================================="
          echo "Downloading videos from Hugging Face"
          echo "=========================================="

          START=$(date +%s)

          wget -O video1.mp4 \
            "https://huggingface.co/viktorgrow/my-video-storage/resolve/main/vinyl_test_1.mp4" &

          PID1=$!

          wget -O video2.mp4 \
            "https://huggingface.co/viktorgrow/my-video-storage/resolve/main/vinyl_test_2.mp4" &

          PID2=$!

          wget -O video3.mp4 \
            "https://huggingface.co/viktorgrow/my-video-storage/resolve/main/vinyl_test_3.mp4" &

          PID3=$!

          wait $PID1
          wait $PID2
          wait $PID3

          END=$(date +%s)

          echo ""
          echo "Downloads completed."
          echo "Download time: $((END-START)) seconds."
          echo ""

          ls -lh video1.mp4
          ls -lh video2.mp4
          ls -lh video3.mp4


      # ==========================================================
      # 3. Check ORIGINAL video parameters
      # ==========================================================

      - name: Check original video parameters
        run: |

          echo ""
          echo "=========================================="
          echo "VIDEO 1"
          echo "=========================================="

          ffprobe \
            -v error \
            -show_entries \
            stream=index,codec_name,codec_long_name,width,height,pix_fmt,r_frame_rate,avg_frame_rate,time_base,bit_rate,sample_rate,channels,channel_layout \
            -of default=noprint_wrappers=1 \
            video1.mp4

          echo ""
          echo "=========================================="
          echo "VIDEO 2"
          echo "=========================================="

          ffprobe \
            -v error \
            -show_entries \
            stream=index,codec_name,codec_long_name,width,height,pix_fmt,r_frame_rate,avg_frame_rate,time_base,bit_rate,sample_rate,channels,channel_layout \
            -of default=noprint_wrappers=1 \
            video2.mp4

          echo ""
          echo "=========================================="
          echo "VIDEO 3"
          echo "=========================================="

          ffprobe \
            -v error \
            -show_entries \
            stream=index,codec_name,codec_long_name,width,height,pix_fmt,r_frame_rate,avg_frame_rate,time_base,bit_rate,sample_rate,channels,channel_layout \
            -of default=noprint_wrappers=1 \
            video3.mp4


      # ==========================================================
      # 4. Create concat playlist
      # ==========================================================

      - name: Create playlist
        run: |
          set -e

          echo "file 'video1.mp4'" > playlist.txt
          echo "file 'video2.mp4'" >> playlist.txt
          echo "file 'video3.mp4'" >> playlist.txt

          echo ""
          echo "=========================================="
          echo "PLAYLIST"
          echo "=========================================="

          cat playlist.txt


      # ==========================================================
      # 5. Create ONE combined file WITHOUT re-encoding
      # ==========================================================

      - name: Build lossless playlist
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "Building playlist WITHOUT re-encoding"
          echo "=========================================="

          START=$(date +%s)

          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i playlist.txt \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -movflags +faststart \
            playlist.mp4

          END=$(date +%s)

          echo ""
          echo "Playlist created."
          echo "Processing time: $((END-START)) seconds."
          echo ""

          ls -lh playlist.mp4

          echo ""
          echo "Playlist parameters:"
          echo ""

          ffprobe \
            -v error \
            -show_entries \
            stream=index,codec_name,width,height,pix_fmt,r_frame_rate,avg_frame_rate,time_base,bit_rate,sample_rate,channels,channel_layout \
            -of default=noprint_wrappers=1 \
            playlist.mp4


      # ==========================================================
      # 6. Start YouTube stream
      # ==========================================================

      - name: Start YouTube stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        run: |

          echo "=========================================="
          echo "STARTING YOUTUBE STREAM"
          echo "=========================================="

          echo ""
          echo "VIDEO 1"
          echo "   ↓"
          echo "VIDEO 2"
          echo "   ↓"
          echo "VIDEO 3"
          echo "   ↓"
          echo "VIDEO 1"
          echo "   ↓"
          echo "VIDEO 2"
          echo "   ↓"
          echo "VIDEO 3"
          echo "   ↓"
          echo "INFINITE LOOP"
          echo ""

          echo "IMPORTANT:"
          echo "No video re-encoding."
          echo "No audio re-encoding."
          echo "Original FPS preserved."
          echo "Original bitrate preserved."
          echo ""

          ffmpeg \
            -re \
            -stream_loop -1 \
            -fflags +genpts \
            -i playlist.mp4 \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"
