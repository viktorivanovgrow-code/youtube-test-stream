name: 24/7 YouTube Stream

on:
  schedule:
    # Автоматический перезапуск каждые 5 часов
    - cron: '0 */5 * * *'
  workflow_dispatch: # Позволяет запускать стрим вручную кнопкой

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download Video and Start Streaming
      env:
        STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        # ЗАМЕНИТЕ ТЕКСТ НИЖЕ НА ВАШ ID ИЗ GOOGLE ДИСКА:
        GOOGLE_DRIVE_ID: "1N7l2CCjQO97lxPzbYgG3qbeGfIjoecYk"
      run: |
        echo "=== СКАЧИВАНИЕ ВИДЕО С GOOGLE DRIVE ==="
        # Безопасное скачивание файла любого размера через API Google Drive
        curl -L "https://google.com" -o input.mp4
        
        echo "=== ПРОВЕРКА РАЗМЕРА ФАЙЛА ==="
        ls -lh input.mp4
        
        if [ ! -s input.mp4 ]; then
          echo "Ошибка: Не удалось скачать файл с Google Диска!"
          exit 1
        fi
        
        echo "=== ЗАПУСК ТРАНСЛЯЦИИ НА YOUTUBE ==="
        timeout 20400 ffmpeg -re -stream_loop -1 -i input.mp4 \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://://youtube.com"
