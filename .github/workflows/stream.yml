name: YouTube Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ============================================================
      # INSTALL FFMPEG
      # ============================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ============================================================
      # DOWNLOAD BOTH FILES IN PARALLEL
      # ============================================================

      - name: Download videos
        run: |

          echo "Downloading video 1 and video 2..."

          wget -O video1_source.mp4 \
          "https://huggingface.co/spaces/viktorgrow/my-video-storage/resolve/main/TEST%20STEAR.mp4" &

          PID1=$!

          wget -O video2_source.mp4 \
          "https://huggingface.co/spaces/viktorgrow/my-video-storage/resolve/main/test-video-2.mp4" &

          PID2=$!

          wait $PID1
          wait $PID2

          echo "Both files downloaded."

          ls -lh video1_source.mp4
          ls -lh video2_source.mp4

      # ============================================================
      # NORMALIZE VIDEO 1
      # ============================================================

      - name: Normalize video 1
        run: |

          ffmpeg \
            -y \
            -i video1_source.mp4 \
            -map 0:v:0 \
            -map 0:a:0? \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,fps=25" \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 4000k \
            -maxrate 4000k \
            -bufsize 8000k \
            -pix_fmt yuv420p \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 320k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            video1.mp4

      # ============================================================
      # NORMALIZE VIDEO 2
      # ============================================================

      - name: Normalize video 2
        run: |

          ffmpeg \
            -y \
            -i video2_source.mp4 \
            -map 0:v:0 \
            -map 0:a:0? \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,fps=25" \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 4000k \
            -maxrate 4000k \
            -bufsize 8000k \
            -pix_fmt yuv420p \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 320k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            video2.mp4

      # ============================================================
      # START INFINITE VIDEO LOOP
      # ============================================================

      - name: Start FFmpeg loop
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |

          echo "Starting infinite playlist:"
          echo "VIDEO 1 → VIDEO 2 → VIDEO 1 → VIDEO 2 → ..."

          (
            while true
            do

              echo "========================================"
              echo "Starting VIDEO 1"
              echo "========================================"

              ffmpeg \
                -re \
                -fflags +genpts \
                -i video1.mp4 \
                -r 25 \
                -c:v libx264 \
                -preset ultrafast \
                -tune zerolatency \
                -b:v 4000k \
                -maxrate 4000k \
                -bufsize 8000k \
                -pix_fmt yuv420p \
                -g 50 \
                -keyint_min 50 \
                -sc_threshold 0 \
                -c:a aac \
                -b:a 320k \
                -ar 44100 \
                -ac 2 \
                -f flv \
                "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"

              echo "VIDEO 1 finished."

              echo "========================================"
              echo "Starting VIDEO 2"
              echo "========================================"

              ffmpeg \
                -re \
                -fflags +genpts \
                -i video2.mp4 \
                -r 25 \
                -c:v libx264 \
                -preset ultrafast \
                -tune zerolatency \
                -b:v 4000k \
                -maxrate 4000k \
                -bufsize 8000k \
                -pix_fmt yuv420p \
                -g 50 \
                -keyint_min 50 \
                -sc_threshold 0 \
                -c:a aac \
                -b:a 320k \
                -ar 44100 \
                -ac 2 \
                -f flv \
                "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"

              echo "VIDEO 2 finished."

            done
          ) > ffmpeg.log 2>&1 &

          echo $! > ffmpeg.pid

          echo "FFmpeg loop started."

          sleep 5

          echo "===== FFMPEG LOG ====="
          tail -50 ffmpeg.log

      # ============================================================
      # START NEXT ACTION AFTER 12 MINUTES
      # ============================================================

      - name: Start next Action
        env:
          GH_RESTART_TOKEN: ${{ secrets.GH_RESTART_TOKEN }}
        run: |

          echo "Current Action timeout: 15 minutes."
          echo "Next Action will start after 12 minutes."
          echo "Target overlap: 2 minutes."

          sleep 720

          echo "12 minutes passed."
          echo "Starting next Action..."

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_RESTART_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/stream.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Next Action successfully started."

          echo "Keeping current Action alive for 2 more minutes..."

          sleep 120

          echo "Current Action completed."
