name: YouTube Playlist Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ----------------------------------------
      # 1. Install FFmpeg
      # ----------------------------------------

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version


      # ----------------------------------------
      # 2. Download both videos
      # ----------------------------------------

      - name: Download videos
        run: |
          wget -O video1_source.mp4 \
          "https://huggingface.co/spaces/viktorgrow/my-video-storage/resolve/main/TEST%20STEAR.mp4" &

          wget -O video2_source.mp4 \
          "https://huggingface.co/spaces/viktorgrow/my-video-storage/resolve/main/test-video-2.mp4" &

          wait

          echo "Downloads completed."

          ls -lh video1_source.mp4
          ls -lh video2_source.mp4


      # ----------------------------------------
      # 3. Normalize VIDEO 1
      # ----------------------------------------

      - name: Normalize video 1
        run: |
          ffmpeg \
            -y \
            -i video1_source.mp4 \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,fps=25" \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 4000k \
            -maxrate 4000k \
            -bufsize 8000k \
            -pix_fmt yuv420p \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 320k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            video1.mp4


      # ----------------------------------------
      # 4. Normalize VIDEO 2
      # ----------------------------------------

      - name: Normalize video 2
        run: |
          ffmpeg \
            -y \
            -i video2_source.mp4 \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,fps=25" \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 4000k \
            -maxrate 4000k \
            -bufsize 8000k \
            -pix_fmt yuv420p \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 320k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            video2.mp4


      # ----------------------------------------
      # 5. Create playlist
      # ----------------------------------------

      - name: Create playlist
        run: |
          echo "file 'video1.mp4'" > playlist.txt
          echo "file 'video2.mp4'" >> playlist.txt

          cat playlist.txt


      # ----------------------------------------
      # 6. Join videos into ONE MP4
      # ----------------------------------------

      - name: Build playlist MP4
        run: |
          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i playlist.txt \
            -c copy \
            -movflags +faststart \
            playlist.mp4

          ls -lh playlist.mp4

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            playlist.mp4


      # ----------------------------------------
      # 7. Start ONE continuous RTMP stream
      # ----------------------------------------

      - name: Start YouTube stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          echo "Starting continuous playlist stream..."
          echo "Playlist: video1 -> video2 -> video1 -> video2..."
          echo "One FFmpeg process."
          echo "One RTMP connection."

          ffmpeg \
            -re \
            -stream_loop -1 \
            -fflags +genpts \
            -i playlist.mp4 \
            -r 25 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 4000k \
            -maxrate 4000k \
            -bufsize 8000k \
            -pix_fmt yuv420p \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            -c:a copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"
