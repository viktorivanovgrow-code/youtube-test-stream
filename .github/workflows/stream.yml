name: 24/7 YouTube Stream

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download Video and Start Streaming
      run: |
        echo "=== СКАЧИВАНИЕ ВИДЕО ==="
        # ВНИМАТЕЛЬНО ВСТАВЬТЕ ССЫЛКУ С СЛОВОМ RESOLVE ВНУТРЬ КАВЫЧЕК:
        curl -L -o input.mp4 "https://huggingface.co/spaces/viktorgrow/my-video-storage/resolve/main/TEST%20STEAR.mp4"
        
        echo "=== ПРОВЕРКА РАЗМЕРА ФАЙЛА ==="
        ls -lh input.mp4
        
        echo "=== ЗАПУСК ТРАНСЛЯЦИИ НА YOUTUBE ==="
        # ВСТАВЬТЕ ВАШ КЛЮЧ ТРАНСЛЯЦИИ ВМЕСТО СЛОВ: macp-kg7e-y7s8-asb0-ae3v
        timeout 20400 ffmpeg -re -stream_loop -1 -i input.mp4 \
          -c:v copy -c:a copy \
          -f flv "rtmp://://youtube.com"
