name: YouTube Playlist Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ----------------------------------------
      # 1. Install FFmpeg
      # ----------------------------------------

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version


      # ----------------------------------------
      # 2. Download both videos in parallel
      # ----------------------------------------

      - name: Download videos
        run: |
          echo "Downloading both videos..."

          START=$(date +%s)

          wget -O video1_source.mp4 \
          "https://huggingface.co/spaces/viktorgrow/my-video-storage/resolve/main/TEST%20STEAR.mp4" &

          PID1=$!

          wget -O video2_source.mp4 \
          "https://huggingface.co/spaces/viktorgrow/my-video-storage/resolve/main/test-video-2.mp4" &

          PID2=$!

          wait $PID1
          wait $PID2

          END=$(date +%s)

          echo "Downloads completed."
          echo "Download time: $((END-START)) seconds."

          ls -lh video1_source.mp4
          ls -lh video2_source.mp4


      # ----------------------------------------
      # 3. Normalize VIDEO 1
      # ----------------------------------------

      - name: Normalize video 1
        run: |
          echo "Normalizing video 1..."

          START=$(date +%s)

          ffmpeg \
            -y \
            -i video1_source.mp4 \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,fps=25" \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 4000k \
            -maxrate 4000k \
            -bufsize 8000k \
            -pix_fmt yuv420p \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 320k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            video1.mp4

          END=$(date +%s)

          echo "Video 1 normalization time: $((END-START)) seconds."


      # ----------------------------------------
      # 4. Normalize VIDEO 2
      # ----------------------------------------

      - name: Normalize video 2
        run: |
          echo "Normalizing video 2..."

          START=$(date +%s)

          ffmpeg \
            -y \
            -i video2_source.mp4 \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,fps=25" \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 4000k \
            -maxrate 4000k \
            -bufsize 8000k \
            -pix_fmt yuv420p \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 320k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            video2.mp4

          END=$(date +%s)

          echo "Video 2 normalization time: $((END-START)) seconds."


      # ----------------------------------------
      # 5. Create playlist
      # ----------------------------------------

      - name: Create playlist
        run: |
          echo "file 'video1.mp4'" > playlist.txt
          echo "file 'video2.mp4'" >> playlist.txt

          echo "Playlist:"
          cat playlist.txt


      # ----------------------------------------
      # 6. Create ONE combined MP4
      # ----------------------------------------

      - name: Build playlist MP4
        run: |
          echo "Building combined playlist..."

          START=$(date +%s)

          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i playlist.txt \
            -c copy \
            -movflags +faststart \
            playlist.mp4

          END=$(date +%s)

          echo "Playlist creation time: $((END-START)) seconds."

          ls -lh playlist.mp4

          echo "Playlist duration:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            playlist.mp4


      # ----------------------------------------
      # 7. Start FFmpeg / YouTube
      # ----------------------------------------

      - name: Start YouTube stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          echo "=========================================="
          echo "Starting YouTube stream"
          echo "=========================================="
          echo "Playlist:"
          echo "VIDEO 1 -> VIDEO 2 -> VIDEO 1 -> VIDEO 2..."
          echo ""
          echo "One FFmpeg process."
          echo "One RTMP connection."
          echo "Infinite playlist loop."
          echo ""
          echo "Current Action lifetime: 30 minutes."
          echo "Next Action starts after: 22 minutes."
          echo "Maximum planned overlap: 8 minutes."
          echo "=========================================="

          ffmpeg \
            -re \
            -stream_loop -1 \
            -fflags +genpts \
            -i playlist.mp4 \
            -r 25 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 4000k \
            -maxrate 4000k \
            -bufsize 8000k \
            -pix_fmt yuv420p \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            -c:a copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            > ffmpeg.log 2>&1 &

          FFMPEG_PID=$!

          echo "FFmpeg PID: ${FFMPEG_PID}"

          sleep 5

          echo "Initial FFmpeg log:"
          cat ffmpeg.log


      # ----------------------------------------
      # 8. Start next Action after 22 minutes
      # ----------------------------------------

      - name: Start next Action
        env:
          GH_RESTART_TOKEN: ${{ secrets.GH_RESTART_TOKEN }}
        run: |

          echo "=========================================="
          echo "Current Action: 30 minutes"
          echo "Next Action: starts after 22 minutes"
          echo "=========================================="

          sleep 1320

          echo "22 minutes passed."
          echo "Starting next Action..."

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_RESTART_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/stream.yml/dispatches" \
            -d '{"ref":"main"}'

          echo ""
          echo "Next Action successfully started."
          echo ""
          echo "Current Action continues running."
          echo "It will finish at approximately 30 minutes."

          sleep 480

          echo ""
          echo "30 minutes completed."
          echo "Current Action is finishing."
