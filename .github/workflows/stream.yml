name: 24/7 YouTube Stream

on:
  schedule:
    # Автоматический перезапуск каждые 5 часов
    - cron: '0 */5 * * *'
  workflow_dispatch: # Позволяет запускать стрим вручную кнопкой

# Открываем явные права на чтение секретов для виртуальной машины
permissions:
  contents: read
  actions: read

jobs:
  stream:
    runs-on: ubuntu-latest
    # Привязываем задачу к стандартному окружению, чтобы секреты точно считались
    environment:
      name: production
      url: https://youtube.com

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download Video and Start Streaming
      env:
        STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        # Ваша рабочая ссылка на скачивание с Hugging Face:
        VIDEO_URL: "https://huggingface.co/spaces/viktorgrow/my-video-storage/resolve/main/TEST%20STEAR.mp4"
      run: |
        echo "=== СКАЧИВАНИЕ ВИДЕО ==="
        curl -L -o input.mp4 "$VIDEO_URL"
        
        echo "=== ПРОВЕРКА РАЗМЕРА ФАЙЛА ==="
        ls -lh input.mp4
        
        if [ ! -s input.mp4 ]; then
          echo "Ошибка: Файл пустой, скачивание сорвалось!"
          exit 1
        fi
        
        echo "=== ЗАПУСК ТРАНСЛЯЦИИ НА YOUTUBE ==="
        # Запуск трансляции оригинала без нагрузки на процессор
        timeout 20400 ffmpeg -re -stream_loop -1 -i input.mp4 \
          -c:v copy -c:a copy \
          -f flv "rtmp://://youtube.com"
