name: YouTube Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download video
        run: |
          wget -O video.mp4 \
          "https://huggingface.co/spaces/viktorgrow/my-video-storage/resolve/main/TEST%20STEAR.mp4"

          ls -lh video.mp4

      - name: Start FFmpeg
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ffmpeg \
            -re \
            -stream_loop -1 \
            -i video.mp4 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 6000k \
            -maxrate 6000k \
            -bufsize 12000k \
            -pix_fmt yuv420p \
            -r 25 \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 320k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            > ffmpeg.log 2>&1 &

          echo $! > ffmpeg.pid

          echo "FFmpeg started."

      - name: Wait 2 minutes 45 seconds
        run: |
          echo "Current FFmpeg is running."
          echo "Next Action will start after 2 minutes 45 seconds."

          sleep 165

      - name: Start next Action
        env:
          GH_RESTART_TOKEN: ${{ secrets.GH_RESTART_TOKEN }}
        run: |
          echo "Starting next instance..."

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_RESTART_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/stream.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Next Action successfully started."

      - name: Keep current FFmpeg for 15 seconds
        run: |
          echo "15-second overlap..."
          sleep 15

      - name: Stop current FFmpeg
        run: |
          echo "Stopping current FFmpeg..."

          kill $(cat ffmpeg.pid) || true

          sleep 2

          echo "Current Action finished."
