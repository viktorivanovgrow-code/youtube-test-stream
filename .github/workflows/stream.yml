name: YouTube Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    timeout-minutes: 12

    steps:

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download video
        run: |
          wget -O video.mp4 \
          "https://huggingface.co/spaces/viktorgrow/my-video-storage/resolve/main/TEST%20STEAR.mp4"

          ls -lh video.mp4

      - name: Start FFmpeg
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ffmpeg \
            -re \
            -fflags +genpts \
            -stream_loop -1 \
            -i video.mp4 \
            -r 25 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 4000k \
            -maxrate 4000k \
            -bufsize 8000k \
            -pix_fmt yuv420p \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            -c:a copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            > ffmpeg.log 2>&1 &

          echo $! > ffmpeg.pid

          echo "FFmpeg started."
          sleep 2

          cat ffmpeg.log

      - name: Keep stream running and start next Action
        env:
          GH_RESTART_TOKEN: ${{ secrets.GH_RESTART_TOKEN }}
        run: |

          echo "Current Action will run for 10 minutes."
          echo "Next Action will start after 8 minutes."

          sleep 480

          echo "8 minutes passed."
          echo "Starting next instance of the same workflow..."

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_RESTART_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/stream.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Next Action successfully started."

          echo "Keeping current FFmpeg alive for another 2 minutes..."

          sleep 120

          echo "10 minutes completed."
          echo "Current Action is finishing."
