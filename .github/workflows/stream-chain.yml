name: Stream Chain Test

on:
  workflow_dispatch:
    inputs:
      handoff_epoch:
        description: "Unix timestamp when next stream should start"
        required: false
        default: "0"
      chain_number:
        description: "Chain number"
        required: false
        default: "1"

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. INSTALL FFMPEG
      # ============================================================

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ============================================================
      # 3. SELECT RANDOM VIDEO
      # ============================================================

      - name: Select random video
        id: select
        shell: bash
        run: |
          set -e

          VIDEO_URL=$(python3 -c '
          import json
          import random

          with open("playlist.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          videos = data["videos"]

          if not videos:
              raise SystemExit("ERROR: playlist is empty")

          print(random.choice(videos))
          ')

          echo "========================================"
          echo "SELECTED VIDEO"
          echo "========================================"
          echo "$VIDEO_URL"
          echo "========================================"

          {
            echo "video_url<<EOF"
            echo "$VIDEO_URL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. DOWNLOAD VIDEO
      # ============================================================

      - name: Download video
        shell: bash
        run: |
          set -e

          URL="${{ steps.select.outputs.video_url }}"

          echo "========================================"
          echo "DOWNLOADING VIDEO"
          echo "========================================"
          echo "$URL"
          echo

          START=$(date +%s)

          wget \
            --tries=3 \
            --timeout=30 \
            --progress=bar:force:noscroll \
            -O stream_video.mp4 \
            "$URL"

          END=$(date +%s)
          ELAPSED=$((END - START))

          BYTES=$(stat -c%s stream_video.mp4)
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES / 1000000}")

          if [ "$ELAPSED" -lt 1 ]; then
            ELAPSED=1
          fi

          SPEED=$(awk "BEGIN {printf \"%.2f\", $BYTES / $ELAPSED / 1000000}")

          echo
          echo "========================================"
          echo "DOWNLOAD COMPLETE"
          echo "========================================"
          echo "Size:     ${MB} MB"
          echo "Time:     ${ELAPSED} sec"
          echo "Speed:    ${SPEED} MB/s"
          echo "========================================"

      # ============================================================
      # 5. ANALYZE VIDEO
      # ============================================================

      - name: Analyze video
        id: video
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VIDEO INFORMATION"
          echo "========================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,bit_rate,pix_fmt,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            stream_video.mp4

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            stream_video.mp4)

          DURATION_INT=$(python3 -c "import math; print(math.ceil(float('$DURATION')))")

          echo
          echo "Exact duration: $DURATION"
          echo "Ceil duration:  $DURATION_INT"

          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "duration_int=$DURATION_INT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 6. CALCULATE HANDOFF TIME
      # ============================================================

      - name: Calculate handoff time
        id: timing
        shell: bash
        run: |
          set -e

          INPUT_HANDOFF="${{ github.event.inputs.handoff_epoch }}"

          if [ "$INPUT_HANDOFF" != "0" ] && [ -n "$INPUT_HANDOFF" ]; then
            HANDOFF_EPOCH="$INPUT_HANDOFF"

            echo "Using handoff time received from previous action:"
            echo "$HANDOFF_EPOCH"

          else
            START_EPOCH=$(date +%s)

            HANDOFF_EPOCH=$((START_EPOCH + ${{ steps.video.outputs.duration_int }}))

            echo "First action."
            echo "Stream start epoch:  $START_EPOCH"
            echo "Handoff epoch:       $HANDOFF_EPOCH"
          fi

          echo "handoff_epoch=$HANDOFF_EPOCH" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 7. START NEXT ACTION
      # ============================================================

      - name: Start next action
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          HANDOFF="${{ steps.timing.outputs.handoff_epoch }}"
          CURRENT_CHAIN="${{ github.event.inputs.chain_number || '1' }}"
          NEXT_CHAIN=$((CURRENT_CHAIN + 1))

          echo "========================================"
          echo "STARTING NEXT ACTION"
          echo "========================================"
          echo "Current chain: $CURRENT_CHAIN"
          echo "Next chain:    $NEXT_CHAIN"
          echo "Handoff epoch: $HANDOFF"
          echo "========================================"

          gh workflow run stream-chain.yml \
            --repo "${GITHUB_REPOSITORY}" \
            -f handoff_epoch="$HANDOFF" \
            -f chain_number="$NEXT_CHAIN"

          echo "Next action dispatched."

      # ============================================================
      # 8. WAIT FOR HANDOFF
      # ============================================================

      - name: Wait for handoff
        shell: bash
        run: |
          set -e

          HANDOFF="${{ steps.timing.outputs.handoff_epoch }}"

          echo "========================================"
          echo "WAITING FOR HANDOFF"
          echo "========================================"
          echo "Handoff epoch: $HANDOFF"
          echo

          while true; do
            NOW=$(date +%s)
            REMAINING=$((HANDOFF - NOW))

            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            echo "Remaining: ${REMAINING} sec"
            sleep 5
          done

          echo
          echo "HANDOFF TIME REACHED."
          echo "Starting YouTube stream..."

      # ============================================================
      # 9. START YOUTUBE
      # ============================================================

      - name: Start YouTube stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "ERROR: YOUTUBE_STREAM_KEY secret is empty"
            exit 1
          fi

          echo "========================================"
          echo "STARTING YOUTUBE STREAM"
          echo "========================================"
          echo "Duration: ${{ steps.video.outputs.duration }} sec"
          echo "Video:    copy"
          echo "Audio:    copy"
          echo "========================================"

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -re \
            -i stream_video.mp4 \
            -map 0:v:0 \
            -map 0:a:0 \
            -c copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"

      # ============================================================
      # 10. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        run: |
          rm -f stream_video.mp4
          echo "Downloaded video removed."
